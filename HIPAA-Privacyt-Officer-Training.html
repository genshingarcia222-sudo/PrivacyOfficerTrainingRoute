{id:'m4-3', situation:'A father requests his 16-year-old\'s therapy records. State law in this jurisdiction gives minors of that age an independent right to consent to their own mental health treatment.',
 ask:'What should happen before releasing anything?',
 options:[{id:'a',text:'Release automatically — parents always have access to minors\' records'},{id:'b',text:'Verify under state law whether the parent qualifies as a "personal representative" for these specific records before releasing'},{id:'c',text:'Deny automatically'},{id:'d',text:'Release only the billing portion'}],
 correct:'b', rationale:'State law — not HIPAA — usually determines personal representative status for a minor, and it can vary by the type of record when a minor has an independent consent right.'},
{id:'m4-4', situation:'A patient requests an amendment to a diagnosis she believes is wrong. The provider reviewed the chart and believes the diagnosis is accurate and well-documented.',
 ask:'What is the correct response?',
 options:[{id:'a',text:'The provider may deny, but must offer the patient a way to submit a statement of disagreement to be appended to the record'},{id:'b',text:'The provider must make the amendment regardless'},{id:'c',text:'The provider may simply ignore the request'},{id:'d',text:'Amendment requests are never permitted'}],
 correct:'a', rationale:'Denial is permitted on specific grounds like accuracy/completeness, but the entity must still offer the statement-of-disagreement process.'},
{id:'m4-5', situation:'A patient asks that a cardiology visit not be disclosed to her health plan for payment purposes. She has not paid for that visit out of pocket.',
 ask:'What is the correct response?',
 options:[{id:'a',text:'Must grant — all restriction requests are mandatory'},{id:'b',text:'May decline — the mandatory restriction right only applies when the individual paid in full out of pocket for that specific item/service'},{id:'c',text:'Must ask her insurer for permission'},{id:'d',text:'Not a valid type of request at all'}],
 correct:'b', rationale:'General restriction requests are not mandatory; the one mandatory exception is tied specifically to full out-of-pocket payment.'},
{id:'m4-6', situation:'Same patient as above, but this time she DID pay in full, out of pocket, for the specific service in question and does not want it billed to or disclosed to her plan.',
 ask:'What is the correct response now?',
 options:[{id:'a',text:'The covered entity must grant the restriction for that specific item/service'},{id:'b',text:'The covered entity may still decline'},{id:'c',text:'This requires a court order'},{id:'d',text:'Only applies to behavioral health services'}],
 correct:'a', rationale:'This is the one restriction request that is mandatory under HITECH — full out-of-pocket payment for a specific item/service.'},
{id:'m4-7', situation:'A patient requests an accounting of all disclosures made about her in the past six years, including routine treatment, payment, and operations disclosures.',
 ask:'What is the most accurate response?',
 options:[{id:'a',text:'All TPO disclosures must be listed'},{id:'b',text:'Under the currently effective regulatory text, routine TPO disclosures are generally excluded from the accounting of disclosures — verify current status before representing this as settled either way'},{id:'c',text:'No disclosures need ever be tracked'},{id:'d',text:'Only disclosures to law enforcement must be listed'}],
 correct:'b', rationale:'This is a good habit-forming example: HITECH proposed a broader electronic access report, but HHS never finalized that as binding regulatory text, so the current accounting-of-disclosures rule (which excludes routine TPO) still governs — always confirm you\'re citing what\'s actually in force.'},
{id:'m4-8', situation:'A patient asks the clinic to contact her only by a specific personal email address, not her home phone, and does not explain why.',
 ask:'What is the correct response?',
 options:[{id:'a',text:'Require a reason before accommodating'},{id:'b',text:'Reasonably accommodate the request without requiring an explanation'},{id:'c',text:'Deny — the clinic sets its own contact policy'},{id:'d',text:'Only accommodate for behavioral health patients'}],
 correct:'b', rationale:'Confidential communication requests must generally be reasonably accommodated without demanding a justification.'},
{id:'m4-9', situation:'A patient requests amendment of a progress note because she dislikes its tone, not because any fact in it is inaccurate.',
 ask:'What is the correct response?',
 options:[{id:'a',text:'Must amend — patient preference controls'},{id:'b',text:'May deny, since amendment addresses accuracy/completeness, not tone — but must still offer the disagreement-statement process'},{id:'c',text:'Automatically refer to OCR'},{id:'d',text:'Delete the note entirely'}],
 correct:'b', rationale:'The amendment right is about accuracy and completeness, not stylistic disagreement, though the disagreement-statement option still applies.'},
{id:'m4-10', situation:'An adult daughter calls asking to pick up her elderly father\'s prescription records "because he asked me to." Nothing about this permission is documented anywhere, and she was not present at any recent visit.',
 ask:'What should happen before disclosing anything?',
 options:[{id:'a',text:'Disclose — adult children are automatically personal representatives'},{id:'b',text:'Obtain some basis for the disclosure first — e.g., confirm with the patient directly, or rely on documented involvement in care — rather than an unverified phone assertion alone'},{id:'c',text:'Automatically deny all family requests'},{id:'d',text:'Require a court order in every case'}],
 correct:'b', rationale:'HIPAA does allow disclosure to family involved in care based on professional judgment, but that judgment needs some basis — a bare, unverified phone claim with nothing documented isn\'t enough on its own.'}
],

m5: [
{id:'m5-1', situation:'A nurse uses her clinical EHR credentials (not the patient portal) to look up her own child\'s lab results to help schedule a follow-up, outside her assigned patient care duties.',
 ask:'Classify this access.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b',
 rationale:'Using clinical system credentials to access a family member\'s record outside one\'s assigned duties is generally prohibited — she should use the patient portal like any other family member, or have another clinician assist.'},
{id:'m5-2', situation:'A billing coordinator, after hearing office gossip, looks up a coworker\'s chart to see their diagnosis out of curiosity.',
 ask:'Classify this access.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'Classic snooping — no job-related purpose, a workforce sanctions violation and a training/access-control failure.'},
{id:'m5-3', situation:'A physician assistant looks up a local celebrity\'s chart, who is not their patient, "just to see."',
 ask:'Classify this access.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'c',
 rationale:'This is noncompliant on its face, and celebrity/high-profile snooping specifically warrants a full investigation (audit trail review, sanctions, and — depending on scope — a breach risk assessment).'},
{id:'m5-4', situation:'A front-desk staffer discusses a patient\'s upcoming procedure, using only the patient\'s first name, with a coworker inside a crowded public elevator.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b',
 rationale:'A workforce conduct violation (careless disclosure in a public space) even though it may not itself meet the definition of a reportable breach — a training/sanctions matter.'},
{id:'m5-5', situation:'A nurse leaves her workstation unlocked and walks away for ten minutes to a semi-public hallway, with a patient\'s open chart still visible on screen.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'Workstation security (locking unattended screens) is a basic Security Rule expectation — this is a clear gap.'},
{id:'m5-6', situation:'Two providers coordinate a patient handoff using a hospital-issued, encrypted, IT-managed messaging app that policy specifically approves for this purpose.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'a', rationale:'Using an approved, managed, encrypted tool for a legitimate treatment purpose is exactly what good policy looks like.'},
{id:'m5-7', situation:'A resident emails a properly de-identified case summary (Safe Harbor standard correctly applied) to a professional teaching listserv.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'a', rationale:'Properly de-identified information isn\'t PHI, so this isn\'t a HIPAA issue (assuming the de-identification was actually done correctly).'},
{id:'m5-8', situation:'A remote biller works from a coffee shop with patient account screens visible to the room, on public wifi with no VPN.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'Both a physical safeguard failure (screen visible to others) and a technical safeguard failure (unsecured network, no VPN).'},
{id:'m5-9', situation:'Four front-desk staff share one generic login ("frontdesk1") because individual account provisioning has been delayed by IT for six months.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'Shared logins violate the unique-user-identification requirement, a required (not addressable) Security Rule technical safeguard, and also break audit-trail accountability.'},
{id:'m5-10', situation:'An employee who is also a patient at the practice logs into the patient portal (not the clinical system) to view her own lab results.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'a', rationale:'She is accessing her own record as a patient through the patient-facing channel — exactly the intended use.'},
{id:'m5-11', situation:'A former employee\'s EHR access was never deactivated after termination. Three weeks later, audit logs show several logins and chart views under her old credentials.',
 ask:'Classify this situation.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'c', rationale:'This needs a full incident-response workflow (Module 11) — access-termination failure plus unauthorized post-employment access.'},
{id:'m5-12', situation:'A manager prints a complete patient chart "in case I need it later," then leaves the printout in a shared, unlocked breakroom for two days before shredding it.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'Unnecessary printing plus inadequate physical safeguards for two full days — a clear policy violation.'},
{id:'m5-13', situation:'A physician posts on personal social media: "Had an incredibly moving moment with a patient today reminding me why I do this work" — no identifying details of any kind.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'a', rationale:'No PHI is disclosed here — a general, non-identifying reflection is not a privacy violation.'},
{id:'m5-14', situation:'The same kind of post, but this time including the patient\'s age, an unusual rare diagnosis, and the exact date and clinic location — details specific enough that people in a small community could likely identify who is meant.',
 ask:'Classify this conduct.', options:[{id:'a',text:'Compliant'},{id:'b',text:'Noncompliant'},{id:'c',text:'Needs investigation'}], correct:'b', rationale:'"Jigsaw identification" — no name is used, but the combination of specific details creates a reasonable basis to identify the patient.'}
],

m6: [
{id:'m6-1', situation:'A patient\'s spouse calls asking for test results. The patient is present at pickup and does not object when staff mention the results in front of the spouse.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Not permitted without a signed authorization'},{id:'b',text:'Permitted based on professional judgment given the patient\'s presence and lack of objection'},{id:'c',text:'Requires a court order'},{id:'d',text:'Requires a formal personal representative designation'}], correct:'b',
 rationale:'HIPAA allows informal disclosure to family/friends involved in care based on the patient\'s presence and apparent agreement — no signed authorization is strictly required in this in-person context.'},
{id:'m6-2', situation:'An adult child not previously involved in care, calling from out of state, asks for full chart access "because I\'m worried about my mom." The patient is competent and has designated no one.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Grant — adult children are automatically authorized'},{id:'b',text:'Not permitted absent the patient\'s authorization or some documented involvement in her care'},{id:'c',text:'Grant partial access only'},{id:'d',text:'Required disclosure'}], correct:'b',
 rationale:'Without patient authorization or a documented basis for involvement, an unverified relative\'s phone request doesn\'t establish a right to full chart access.'},
{id:'m6-3', situation:'A noncustodial parent requests a minor child\'s immunization record. State law gives both parents access to a minor\'s general medical records unless a court order says otherwise, and no such order exists here.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Deny automatically — only custodial parents may access records'},{id:'b',text:'Generally permitted — verify the specific state law and confirm no restricting court order exists'},{id:'c',text:'Requires the other parent\'s written consent'},{id:'d',text:'Requires a subpoena'}], correct:'b',
 rationale:'Absent a restricting court order, each parent generally qualifies as a personal representative for a minor\'s general medical records under most state frameworks — but always verify the actual state law and check for any order.'},
{id:'m6-4', situation:'Local police, without a warrant, subpoena, or court order, ask a hospital to confirm whether a specific named person was treated in the ED last night — a general inquiry, not related to a violent crime victim or an on-premises crime.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Confirm — law enforcement requests are always permitted'},{id:'b',text:'Generally should not confirm without a warrant, court order, subpoena, or another specific applicable exception'},{id:'c',text:'Confirm only if police badge is shown'},{id:'d',text:'A required disclosure'}], correct:'b',
 rationale:'Law-enforcement disclosures without patient authorization require a specific legal basis (court order, warrant, subpoena, or a narrow enumerated exception) — a verbal request alone doesn\'t supply one.'},
{id:'m6-5', situation:'A clinic\'s landlord, who happens to also employ one of the clinic\'s patients, calls asking about that patient\'s recent ED visit, citing no legal basis.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Permitted as a business relationship'},{id:'b',text:'Not permitted absent the patient\'s authorization'},{id:'c',text:'Permitted if the landlord promises confidentiality'},{id:'d',text:'A required disclosure'}], correct:'b', rationale:'No relationship here (landlord, employer, or otherwise) creates a permitted basis for disclosure without authorization.'},
{id:'m6-6', situation:'A patient\'s attorney holds a valid, patient-signed authorization specific to an ongoing personal injury case and requests records within its scope.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Disclose exactly what the authorization specifies'},{id:'b',text:'Deny — attorneys can never receive PHI'},{id:'c',text:'Requires a court order in addition to the authorization'},{id:'d',text:'Disclose the entire chart regardless of scope'}], correct:'a', rationale:'A valid, scope-specific authorization permits disclosure of exactly what it describes — no more, no less.'},
{id:'m6-7', situation:'A skilled nursing facility requests a discharge summary for a patient being transferred there for continuing care.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Permitted — a treatment disclosure between providers'},{id:'b',text:'Requires authorization'},{id:'c',text:'Requires a data use agreement'},{id:'d',text:'Not permitted between different facility types'}], correct:'a', rationale:'Treatment coordination between providers is permitted without authorization, exempt from minimum necessary.'},
{id:'m6-8', situation:'A patient\'s health insurer requests records to process a claim the patient already submitted for that specific episode of care.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Permitted — a payment-purpose disclosure'},{id:'b',text:'Requires authorization'},{id:'c',text:'A required disclosure'},{id:'d',text:'Not permitted without a subpoena'}], correct:'a', rationale:'Disclosure for payment purposes tied to an actual claim is a standard permitted TPO disclosure.'},
{id:'m6-9', situation:'A pharmacy receives a request from a different pharmacy chain to transfer a prescription record because the patient is switching pharmacies; the new pharmacy says the patient asked for the switch, but the original pharmacy has no direct confirmation from the patient.',
 ask:'What is the correct handling?', options:[{id:'a',text:'Generally permitted — an established, treatment-related coordination practice, often also independently authorized under state pharmacy law'},{id:'b',text:'Never permitted between competing pharmacy chains'},{id:'c',text:'Requires a signed authorization first in every case'},{id:'d',text:'Requires a court order'}], correct:'a', rationale:'Prescription transfers between pharmacies at a patient\'s request are a well-established treatment-coordination practice, frequently also directly permitted under state pharmacy law.'},
{id:'m6-10', situation:'A school nurse (subject to FERPA, not HIPAA) requests a copy of a student\'s vaccination record directly from the student\'s outside pediatrician.',
 ask:'What is the correct handling for the pediatrician\'s office?', options:[{id:'a',text:'Release automatically — schools are entitled to health records'},{id:'b',text:'Treat it like any other outside request: generally requires a valid authorization from the parent/guardian (or the minor, if able to consent), unless a specific state immunization-registry law provides an exception'},{id:'c',text:'FERPA automatically grants access to the pediatrician\'s HIPAA-covered record'},{id:'d',text:'Requires a subpoena'}], correct:'b', rationale:'FERPA governs the school\'s own education records, not the outside pediatrician\'s separate HIPAA-covered medical record — the normal authorization analysis applies there.'}
],

m7: [
{id:'m7-1', situation:'A billing employee needs to process a claim for one specific visit and requests access to the patient\'s entire chart.',
 ask:'What is the minimum-necessary-consistent approach?', options:[{id:'a',text:'Grant full chart access'},{id:'b',text:'Grant access limited to the billing-relevant information for that specific visit'},{id:'c',text:'Deny entirely — billing isn\'t a permitted purpose'},{id:'d',text:'Minimum necessary doesn\'t apply to payment purposes'}], correct:'b',
 rationale:'Payment is a TPO purpose, but minimum necessary still applies to it (unlike treatment). Role-based access should be scoped to what billing actually needs.'},
{id:'m7-2', situation:'A scheduling employee needs to move a patient\'s appointment to a different day.',
 ask:'What information does this role need?', options:[{id:'a',text:'Full clinical chart, including diagnoses'},{id:'b',text:'Only scheduling-relevant information — date, time, provider, and general visit-type category'},{id:'c',text:'Billing history'},{id:'d',text:'Nothing — scheduling doesn\'t need PHI at all'}], correct:'b', rationale:'Scoping access to exactly what the task requires is the minimum-necessary design principle in action.'},
{id:'m7-3', situation:'An external courier is picking up ONE patient\'s records to fulfill that patient\'s own authorized disclosure request.',
 ask:'What should the covered entity provide?', options:[{id:'a',text:'A full system export "to be efficient"'},{id:'b',text:'Only the specific patient\'s records matching the scope of the authorized request'},{id:'c',text:'Deny the courier entirely'},{id:'d',text:'All records from that department'}], correct:'b', rationale:'Even with a legitimate authorized purpose, disclosure should be scoped to exactly what was authorized — not an operationally "convenient" broader export.'},
{id:'m7-4', situation:'A treating physician requests access to a patient\'s full history, including records from another department, to make a treatment decision.',
 ask:'Does minimum necessary gate this access?', options:[{id:'a',text:'Yes — the physician must justify each record accessed'},{id:'b',text:'No — treatment access/disclosure is exempt from minimum necessary (though role-based access controls and audit logging still apply as security measures)'},{id:'c',text:'Only for records from a different department'},{id:'d',text:'Only if the patient consents in writing'}], correct:'b', rationale:'Treatment is the one TPO category exempt from minimum necessary — but that doesn\'t remove ordinary access-control and audit-trail expectations under the Security Rule.'},
{id:'m7-5', situation:'A quality-improvement analyst conducting a readmission study needs only diagnosis codes, admission/discharge dates, and unit for 500 charts, but requests full chart PDFs "to be safe."',
 ask:'What is the minimum-necessary-consistent approach?', options:[{id:'a',text:'Grant the full PDFs since it\'s an internal operations purpose'},{id:'b',text:'Scope the data pull to only the fields actually needed for the analysis'},{id:'c',text:'Deny the study entirely'},{id:'d',text:'Require authorization from all 500 patients'}], correct:'b', rationale:'A legitimate health care operations purpose doesn\'t excuse an unscoped, overly broad data pull — minimum necessary still applies.'},
{id:'m7-6', situation:'A supervisor tells a nurse to "just export everything from the last six months for this unit" for an internal workflow-improvement committee, without specifying what data the committee actually needs.',
 ask:'What is the appropriate response?', options:[{id:'a',text:'Export everything as instructed — a supervisor authorized it'},{id:'b',text:'Clarify what specific data elements the committee actually needs before exporting anything'},{id:'c',text:'Refuse to help the committee at all'},{id:'d',text:'Export it, then let the committee delete what it doesn\'t need'}], correct:'b', rationale:'An unscoped, vague request for "everything" is exactly the workflow-design failure minimum necessary is meant to prevent — push back and scope it first.'}
],

m14: [
{id:'m14-1', situation:'A hospital requires unique login credentials and automatic session timeout for every workstation accessing the EHR.',
 ask:'Classify this safeguard.', options:[{id:'a',text:'Administrative safeguard'},{id:'b',text:'Physical safeguard'},{id:'c',text:'Technical safeguard'}], correct:'c', rationale:'Access control and automatic logoff are technical safeguards — controls implemented through information systems.'},
{id:'m14-2', situation:'A clinic requires badge access to the server room and a visitor sign-in log.',
 ask:'Classify this safeguard.', options:[{id:'a',text:'Administrative safeguard'},{id:'b',text:'Physical safeguard'},{id:'c',text:'Technical safeguard'}], correct:'b', rationale:'Facility access controls are physical safeguards.'},
{id:'m14-3', situation:'A practice conducts an annual Security Rule risk analysis and maintains a formal sanctions policy for workforce violations.',
 ask:'Classify this safeguard.', options:[{id:'a',text:'Administrative safeguard'},{id:'b',text:'Physical safeguard'},{id:'c',text:'Technical safeguard'}], correct:'a', rationale:'Risk analysis, risk management, and workforce sanctions policy are administrative safeguards.'},
{id:'m14-4', situation:'A hospital encrypts ePHI in transit between its EHR and a Business Associate\'s billing platform.',
 ask:'Classify this safeguard.', options:[{id:'a',text:'Administrative safeguard'},{id:'b',text:'Physical safeguard'},{id:'c',text:'Technical safeguard'}], correct:'c', rationale:'Transmission security (including encryption) is a technical safeguard.'},
{id:'m14-5', situation:'A clinic maintains policies for the proper disposal of old hard drives and other media containing ePHI.',
 ask:'Classify this safeguard.', options:[{id:'a',text:'Administrative safeguard'},{id:'b',text:'Physical safeguard'},{id:'c',text:'Technical safeguard'}], correct:'b', rationale:'Device and media controls (disposal, reuse, accountability) are physical safeguards.'},
{id:'m14-6', situation:'"Every workforce member must complete security awareness training annually" — this is currently:',
 ask:'How should this be classified?', options:[{id:'a',text:'Currently effective law'},{id:'b',text:'A proposed requirement not yet binding'},{id:'c',text:'Industry best practice only, never required'}], correct:'a', rationale:'Security awareness and training is a required administrative safeguard under the CURRENT, binding Security Rule.'},
{id:'m14-7', situation:'"Multi-factor authentication must be implemented for all systems that access ePHI, with no addressable alternative" — this specific mandate, as written, is currently:',
 ask:'How should this be classified?', options:[{id:'a',text:'Currently effective law, fully binding today'},{id:'b',text:'Part of the January 2025 proposed rule (NPRM) — not yet binding law'},{id:'c',text:'Vacated by a court'},{id:'d',text:'Agency guidance only'}], correct:'b', rationale:'This specific mandatory-MFA-with-no-addressable-alternative language comes from the 2025 proposed Security Rule modernization — it is not yet in force.'},
{id:'m14-8', situation:'"Eliminating the required/addressable distinction so that every implementation specification is mandatory" is currently:',
 ask:'How should this be classified?', options:[{id:'a',text:'Already how the current Security Rule works'},{id:'b',text:'A proposed change that has not been finalized'},{id:'c',text:'Something OCR withdrew in 2025'}], correct:'b', rationale:'The current rule still distinguishes required and addressable specifications; eliminating that distinction is part of the still-pending 2025 NPRM.'},
{id:'m14-9', situation:'"Written documentation of network topology and an annual technical vulnerability scan/penetration test" as a specific mandatory requirement is currently:',
 ask:'How should this be classified?', options:[{id:'a',text:'Already a specific mandatory requirement under the current Security Rule'},{id:'b',text:'Proposed in the 2025 NPRM, not yet a binding specific mandate (general risk-analysis obligations already exist today)'},{id:'c',text:'Agency guidance with no regulatory basis at all'}], correct:'b', rationale:'The current rule requires a general risk analysis; the specific mandate for network mapping and annual penetration testing is part of the proposed (not yet final) 2025 modernization.'},
{id:'m14-10', situation:'A staff member says, "We don\'t need to finish our MFA rollout this year since the new Security Rule NPRM might change the requirements anyway."',
 ask:'What is the correct response to this reasoning?', options:[{id:'a',text:'Agree — wait for the final rule before investing further'},{id:'b',text:'Disagree — the current Security Rule\'s general reasonable-and-appropriate-safeguards standard is binding today regardless of the proposal\'s outcome, and MFA is widely treated as a baseline expectation now'},{id:'c',text:'Agree, since NPRMs are automatically binding on publication'},{id:'d',text:'This is irrelevant to the Security Rule'}], correct:'b', rationale:'A proposed rule never excuses noncompliance with the rule that IS currently in force. The general "reasonable and appropriate safeguards" standard already applies today.'}
],

m18: [
{id:'m18-1', situation:'A new Privacy Officer has limited budget for the first year and must choose one initial priority: a completed, documented Security Rule risk analysis, or a glossy new employee-facing privacy training video.',
 ask:'What is the better first priority?', options:[{id:'a',text:'The training video — visibility matters most'},{id:'b',text:'The risk analysis — it is a specific regulatory requirement and the most commonly cited OCR finding, and it also tells you what training actually needs to cover'},{id:'c',text:'Neither — wait for more budget'},{id:'d',text:'Whichever the CEO prefers'}], correct:'b', rationale:'A completed risk analysis is both a specific compliance obligation and the foundation that should actually shape what training focuses on.'},
{id:'m18-2', situation:'An organization has policies that look good on paper but no way to verify staff are actually following them.',
 ask:'What is the missing governance element?', options:[{id:'a',text:'More policies'},{id:'b',text:'Monitoring/auditing to verify that documented practices match actual practice'},{id:'c',text:'A bigger legal team'},{id:'d',text:'Nothing — policies are sufficient on their own'}], correct:'b', rationale:'A privacy program needs a monitoring/audit function, not just written policy — otherwise there is no way to know if the policy is real.'},
{id:'m18-3', situation:'Leadership wants to reduce the compliance budget by eliminating the annual workforce privacy/security training refresh, since "everyone already knows the basics."',
 ask:'What is the appropriate response?', options:[{id:'a',text:'Agree — training can be eliminated once staff pass it once'},{id:'b',text:'Push back — periodic retraining is an ongoing administrative safeguard requirement, and threats/workflows change over time'},{id:'c',text:'Agree, but only for staff with over 5 years of tenure'},{id:'d',text:'Defer entirely to IT'}], correct:'b', rationale:'Security awareness training is an ongoing requirement, not a one-time event, precisely because risks and workflows evolve.'},
{id:'m18-4', situation:'A privacy program has strong policies and training but has never actually tracked any metrics on incidents, complaints, or training completion.',
 ask:'What should be added?', options:[{id:'a',text:'Nothing — metrics are optional'},{id:'b',text:'A reporting/metrics function so leadership and the board can see program performance and trends over time'},{id:'c',text:'A new EHR system'},{id:'d',text:'Only a legal opinion'}], correct:'b', rationale:'Metrics and reporting are how a program demonstrates effectiveness and informs continuous improvement and executive oversight.'},
{id:'m18-5', situation:'Two findings surface in the same week: (1) a minor, low-risk policy-wording gap in the NPP, and (2) an access-control gap that has allowed several former employees to retain active system access.',
 ask:'Which should be prioritized first?', options:[{id:'a',text:'The NPP wording gap — documentation first'},{id:'b',text:'The access-control gap — it presents active, ongoing risk of unauthorized PHI access'},{id:'c',text:'Handle both with equal urgency'},{id:'d',text:'Neither — wait for the annual audit'}], correct:'b', rationale:'Prioritization should track actual risk exposure — an active access-control failure is a live risk; a wording gap is comparatively lower urgency.'},
{id:'m18-6', situation:'A Privacy Officer is asked to sign off on a new vendor relationship the same day it is presented, with no time to review the BAA or conduct a security review.',
 ask:'What is the appropriate response?', options:[{id:'a',text:'Sign off immediately to support the business'},{id:'b',text:'Push back on the timeline and insist on a documented BAA and security review before PHI flows to the vendor'},{id:'c',text:'Approve verbally, document later'},{id:'d',text:'Delegate the decision to the vendor'}], correct:'b', rationale:'Governance means the review happens before PHI exposure, not after — timeline pressure doesn\'t change what due diligence requires.'},
{id:'m18-7', situation:'A privacy program has never documented who owns which compliance responsibility — the Privacy Officer, IT, and Compliance all assume someone else is tracking corrective action deadlines.',
 ask:'What is missing?', options:[{id:'a',text:'A dedicated IT department'},{id:'b',text:'Clear accountability — documented ownership and due dates for corrective actions'},{id:'c',text:'A new EHR vendor'},{id:'d',text:'Nothing — informal coordination is sufficient'}], correct:'b', rationale:'Governance requires clear, documented accountability — otherwise things fall through the cracks by default.'},
{id:'m18-8', situation:'An annual privacy program plan is due. The Privacy Officer has: last year\'s risk analysis, this year\'s complaint log, an incomplete BAA inventory, and no documented training completion records.',
 ask:'What should the plan prioritize first?', options:[{id:'a',text:'A new logo for training materials'},{id:'b',text:'Closing the BAA inventory and training documentation gaps, since both are foundational compliance evidence auditors and OCR consistently ask for'},{id:'c',text:'Outsourcing the entire privacy function'},{id:'d',text:'Nothing — last year\'s plan can be reused unchanged'}], correct:'b', rationale:'Foundational documentation gaps (BAA inventory, training records) are exactly what an audit or OCR investigation will ask for first — closing them is a defensible top priority.'}
],

m19: [
{id:'m19-1', situation:'IT wants to grant all clinical staff broad, unrestricted EHR access "for operational convenience" to avoid support tickets. Compliance wants strict role-based, minimum-necessary access.',
 ask:'What is the best path forward?', options:[{id:'a',text:'Give IT full unrestricted access as requested'},{id:'b',text:'Design role-based access tied to actual job functions, satisfying minimum necessary while still being efficient enough not to block care — a middle path, not either extreme'},{id:'c',text:'Give Compliance veto power over all IT decisions'},{id:'d',text:'Let each department decide its own access rules independently'}], correct:'b', rationale:'The resolution usually isn\'t "convenience wins" or "compliance wins" — it\'s well-designed role-based access that satisfies the legal requirement without creating unreasonable friction.'},
{id:'m19-2', situation:'Clinical leadership wants a new charting shortcut that would let any provider view any patient\'s full chart instantly during an emergency, without an access request process — arguing patient safety comes first.',
 ask:'How should the Privacy Officer respond?', options:[{id:'a',text:'Refuse entirely — no exceptions for emergencies'},{id:'b',text:'Work with clinical leadership and IT to build a break-glass emergency-access protocol that allows fast access with after-the-fact audit review and justification, rather than either blocking care or removing controls entirely'},{id:'c',text:'Approve unrestricted access with no audit trail'},{id:'d',text:'Defer entirely to clinical judgment with no privacy input'}], correct:'b', rationale:'"Break-glass" emergency access with mandatory post-access audit and justification is the standard way to reconcile patient-safety urgency with access accountability.'},
{id:'m19-3', situation:'The CISO wants to deploy a new security monitoring tool that would log detailed employee activity, including personal browsing, to catch snooping faster. HR raises employee-privacy concerns about the scope.',
 ask:'What is the appropriate role for the Privacy Officer here?', options:[{id:'a',text:'Stay out of it entirely — this is a security/HR matter'},{id:'b',text:'Help scope the monitoring to what is actually needed to detect PHI-access misuse, working with the CISO and HR/Legal on employee-privacy and policy-notice considerations'},{id:'c',text:'Automatically block the CISO\'s proposal'},{id:'d',text:'Approve whatever the CISO originally proposed without review'}], correct:'b', rationale:'The Privacy Officer\'s role is to help find a scope that achieves the legitimate security goal without unnecessary overreach — a governance/brokering role, not a veto or a rubber stamp.'},
{id:'m19-4', situation:'General Counsel wants to settle a patient complaint quietly and quickly without a full internal investigation, worried about litigation exposure. The Privacy Officer believes a full investigation is needed to determine if this reveals a broader system issue.',
 ask:'What is the appropriate path?', options:[{id:'a',text:'Defer entirely to Counsel and skip the investigation'},{id:'b',text:'Explain to Counsel why a documented investigation matters for accurately scoping risk and preventing recurrence, and work together on an approach that satisfies both legal risk management and compliance obligations'},{id:'c',text:'Investigate secretly without informing Counsel'},{id:'d',text:'Escalate directly to the board, bypassing Counsel'}], correct:'b', rationale:'Legal and compliance goals are usually reconcilable with communication — an investigation record can actually reduce litigation risk by showing a good-faith, documented response.'},
{id:'m19-5', situation:'A vendor sales representative tells clinical leadership that a new AI documentation tool "doesn\'t need a BAA because it only processes data temporarily." Clinical leadership wants to move forward quickly.',
 ask:'What is the correct response?', options:[{id:'a',text:'Accept the vendor\'s characterization and proceed'},{id:'b',text:'Independently verify whether the vendor meets the definition of a Business Associate regardless of its own characterization, before any PHI is shared'},{id:'c',text:'Require clinical leadership to personally guarantee compliance'},{id:'d',text:'Refuse to engage with the vendor at all without explanation'}], correct:'b', rationale:'Business Associate status is a legal/factual question, not something a vendor gets to define away in its sales pitch.'},
{id:'m19-6', situation:'HIM wants to charge patients the maximum allowable fee for record copies to offset staff time; the Privacy Officer is concerned this could discourage patients from exercising their access rights.',
 ask:'What is the appropriate response?', options:[{id:'a',text:'Approve the maximum fee without review'},{id:'b',text:'Review the fee structure against the reasonable, cost-based fee standard for access requests, and adjust if it exceeds what\'s permitted or risks chilling the access right'},{id:'c',text:'Eliminate all fees regardless of cost'},{id:'d',text:'Leave the decision entirely to billing'}], correct:'b', rationale:'Access fees are legally bounded by a reasonable, cost-based standard — the Privacy Officer has a legitimate role in keeping the fee structure compliant.'},
{id:'m19-7', situation:'Risk management wants to require every workforce member to sign a broad confidentiality agreement that also asks them to waive their own HIPAA complaint rights as a condition of employment.',
 ask:'What is the correct response?', options:[{id:'a',text:'Approve — it strengthens confidentiality culture'},{id:'b',text:'Flag this to Legal — HIPAA prohibits retaliation against, and interference with, an individual\'s right to file a complaint; a waiver like this raises serious legal concerns'},{id:'c',text:'Implement it quietly without legal review'},{id:'d',text:'Delegate the decision to HR alone'}], correct:'b', rationale:'HIPAA specifically protects the right to file a complaint from retaliation and interference — a mandatory waiver of that right is a red flag needing legal review, not routine approval.'}
],

m21: [
{id:'m21-1', situation:'A patient in SUD treatment at a federally assisted Part 2 program wants their SUD records shared with their primary care provider for care coordination, and signs a single Part 2-compliant consent covering TPO under the 2024 Part 2 Final Rule.',
 ask:'Which framework primarily governs this disclosure?', options:[{id:'a',text:'HIPAA alone'},{id:'b',text:'42 CFR Part 2, which — as updated in 2024 — now permits a single consent for TPO disclosures, with the information then subject to redisclosure rules'},{id:'c',text:'State law exclusively'},{id:'d',text:'The FTC Health Breach Notification Rule'}], correct:'b', rationale:'The 2024 Part 2 Final Rule aligned Part 2 more closely with HIPAA by allowing a single TPO consent, while still applying Part 2\'s specific redisclosure protections.'},
{id:'m21-2', situation:'A hospital in a state whose comprehensive privacy law defines "consumer health data" broadly (with no blanket HIPAA exemption for adjacent non-treatment data) launches a wellness app collecting step counts and mood check-ins, run by the hospital\'s marketing department, not tied to any patient\'s treatment record.',
 ask:'What is the correct analysis?', options:[{id:'a',text:'HIPAA automatically covers this because the operator is a hospital'},{id:'b',text:'This may fall outside HIPAA (not part of a covered function) while still triggering the state\'s consumer-health-data law — verify both separately rather than assuming HIPAA\'s presence forecloses state law'},{id:'c',text:'State law is automatically preempted because the operator is a HIPAA covered entity'},{id:'d',text:'Neither law applies to wellness apps'}], correct:'b', rationale:'Being a HIPAA covered entity for treatment purposes doesn\'t mean every data collection activity by that organization is a HIPAA-covered function — a marketing-run wellness app may need independent state-law analysis.'},
{id:'m21-3', situation:'A state law requires breach notification within 30 days for any resident\'s personal information; HIPAA\'s Breach Notification Rule allows up to 60 days for individual notification. A breach affecting residents of that state has occurred.',
 ask:'What is the correct approach?', options:[{id:'a',text:'Follow only the HIPAA 60-day timeline since it is federal'},{id:'b',text:'Comply with whichever timeline is stricter/faster for the affected residents — federal law is a floor, and a stricter, non-conflicting state deadline generally still applies'},{id:'c',text:'Notify at 90 days to comply with both "eventually"'},{id:'d',text:'Ignore the state law entirely'}], correct:'b', rationale:'Where a state breach-notification law imposes a shorter, non-conflicting deadline, it generally still applies alongside HIPAA\'s floor.'},
{id:'m21-4', situation:'A hospital\'s EHR system technically prevents a specialist from exporting a patient\'s record to send to an outside specialist requested by the patient, citing "our privacy policy."',
 ask:'What should the Privacy Officer check?', options:[{id:'a',text:'Nothing — restricting exports is always privacy-protective'},{id:'b',text:'Whether this practice is actually required by a HIPAA permission or restriction, or whether it instead constitutes information blocking under the separate Cures Act framework, since a blanket "our policy" justification isn\'t automatically a valid HIPAA or information-blocking exception'},{id:'c',text:'Whether the specialist has signed a BAA'},{id:'d',text:'Whether the patient has paid their bill in full'}], correct:'b', rationale:'A privacy-sounding justification isn\'t automatically valid under either HIPAA or the information blocking rule — both frameworks need to be checked, not assumed satisfied.'},
{id:'m21-5', situation:'A researcher wants PHI including SUD treatment history for a multi-site study. Some sites are Part 2 programs, others are ordinary HIPAA covered entities with no Part 2 records involved.',
 ask:'What is the correct approach?', options:[{id:'a',text:'Apply the same HIPAA-only research pathway across all sites'},{id:'b',text:'Apply HIPAA\'s research provisions at the non-Part-2 sites, and separately confirm Part 2\'s own (generally more protective) consent and research requirements at the Part 2 sites'},{id:'c',text:'Assume Part 2 doesn\'t apply because HIPAA already covers health information'},{id:'d',text:'Skip consent requirements entirely for academic research'}], correct:'b', rationale:'Part 2 records carry their own additional requirements on top of HIPAA — a single unified HIPAA-only pathway isn\'t sufficient for the Part 2 sites.'},
{id:'m21-6', situation:'A company operating a direct-to-consumer genetic testing service (not a covered entity or Business Associate) experiences a data breach affecting health-related test results.',
 ask:'Which framework most likely governs breach notification here?', options:[{id:'a',text:'HIPAA\'s Breach Notification Rule'},{id:'b',text:'The FTC Health Breach Notification Rule and/or applicable state breach-notification and consumer-health-data laws, since the company is not HIPAA-regulated'},{id:'c',text:'42 CFR Part 2'},{id:'d',text:'No breach notification law applies to non-covered entities'}], correct:'b', rationale:'Entities outside HIPAA\'s covered-entity/BA scope that handle consumer health data are exactly the gap the FTC Health Breach Notification Rule and state consumer-health-data laws are designed to fill.'},
{id:'m21-7', situation:'Two valid legal requirements appear to genuinely conflict — not just one being stricter than the other — regarding how long certain SUD-related records must be retained versus a state law requiring earlier destruction.',
 ask:'What is the appropriate next step?', options:[{id:'a',text:'Pick whichever is easier to implement'},{id:'b',text:'Escalate to legal counsel — genuine conflicts (as opposed to one law simply being more protective) are exactly the situations that need a legal determination rather than a compliance-team guess'},{id:'c',text:'Ignore both until OCR raises it'},{id:'d',text:'Default to the shortest retention period automatically'}], correct:'b', rationale:'A true conflict (not just a stricter/more-protective difference) is a legal-judgment call, not a compliance-team judgment call — this is exactly when to involve counsel.'}
],

m23: [
{id:'m23-1', situation:'A hospital wants to deploy an ambient AI scribe that listens to patient visits and drafts clinical notes, provided by an outside vendor.',
 ask:'What is the first thing the Privacy Officer should confirm?', options:[{id:'a',text:'Whether the tool produces good-quality notes'},{id:'b',text:'Whether the vendor is a Business Associate and a signed BAA is in place before any PHI (including recorded audio) is shared with it'},{id:'c',text:'Whether clinicians like using it'},{id:'d',text:'Whether it is cheaper than a human scribe'}], correct:'b', rationale:'Any vendor receiving PHI to perform a function on the covered entity\'s behalf needs a BAA before PHI flows to it — the AI angle doesn\'t change this basic gate.'},
{id:'m23-2', situation:'A clinician, frustrated with slow internal tools, pastes a de-identified-looking but actually still-identifiable patient summary into a free, public, consumer-grade AI chatbot to get help drafting a letter.',
 ask:'How should this be classified?', options:[{id:'a',text:'Compliant — the tool is only being used to save time'},{id:'b',text:'A "shadow AI" workforce/access-control incident — PHI was disclosed to a non-Business-Associate public tool with no BAA and no organizational visibility'},{id:'c',text:'Not a privacy issue since no name was included'},{id:'d',text:'Compliant as long as the letter itself doesn\'t leave the organization'}], correct:'b', rationale:'This is an unauthorized disclosure to an uncontracted third party — a workforce training and access-control failure, regardless of good intentions.'},
{id:'m23-3', situation:'A vendor\'s marketing materials state its generative AI documentation tool is "HIPAA compliant" and that it "does not train on customer data."',
 ask:'What should the Privacy Officer do with this claim?', options:[{id:'a',text:'Accept it and proceed to deployment'},{id:'b',text:'Verify it independently through the BAA terms, a security/privacy review, and specific contractual commitments on data use and retention — a marketing claim is not itself a compliance control'},{id:'c',text:'Ignore it since AI vendors are exempt from HIPAA'},{id:'d',text:'Require the vendor to sign a generic NDA instead of a BAA'}], correct:'b', rationale:'Marketing claims are not self-executing legal facts. Specific, verifiable contractual terms (in the BAA) are what actually establish and evidence the vendor\'s obligations.'},
{id:'m23-4', situation:'A health system wants to use historical patient records to train an internal predictive model, using data it claims is "de-identified."',
 ask:'What should the Privacy Officer verify?', options:[{id:'a',text:'Nothing further — internal use is automatically fine'},{id:'b',text:'Whether the data actually meets the Safe Harbor or Expert Determination standard for de-identification, not merely a general claim that it "looks anonymous"'},{id:'c',text:'Only whether the model will be sold externally'},{id:'d',text:'Whether the model\'s outputs will be used clinically'}], correct:'b', rationale:'"De-identified" is a specific, verifiable legal standard, not a subjective impression — this connects directly back to Module 2.'},
{id:'m23-5', situation:'A patient-facing AI chatbot on the hospital\'s own website collects symptoms and the patient\'s name to triage scheduling requests.',
 ask:'How should this data be classified and handled?', options:[{id:'a',text:'Not PHI since it is collected by a chatbot rather than a person'},{id:'b',text:'PHI — collected by the covered entity through its own tool — and subject to the same Security Rule, minimum necessary, and access-control obligations as any other PHI-handling system'},{id:'c',text:'Exempt from HIPAA because it is a new technology'},{id:'d',text:'Only regulated by the FTC, not HIPAA'}], correct:'b', rationale:'Collecting identifiable health information through the covered entity\'s own tool is still PHI, regardless of the collection mechanism.'},
{id:'m23-6', situation:'A department wants to give an AI vendor broad, standing access to the entire EHR "in case future features need more data," rather than the specific data needed for the current use case.',
 ask:'What is the correct response?', options:[{id:'a',text:'Approve — future-proofing is efficient'},{id:'b',text:'Scope access (and the BAA) to the specific data and use case actually needed now, consistent with minimum necessary; expand later through a documented change if new features genuinely require it'},{id:'c',text:'Approve only if the vendor is a well-known company'},{id:'d',text:'Deny AI vendors any EHR access under any circumstances'}], correct:'b', rationale:'Minimum necessary and sound vendor governance both argue against open-ended "just in case" data access.'},
{id:'m23-7', situation:'An AI vendor\'s contract includes a clause allowing it to retain de-identified derivatives of customer data indefinitely to improve its general models across all customers.',
 ask:'What should the Privacy Officer confirm before agreeing?', options:[{id:'a',text:'Nothing — "de-identified" in the contract settles the question'},{id:'b',text:'That the de-identification method actually meets the Safe Harbor or Expert Determination standard, and that the BAA\'s terms on data use, retention, and any residual PHI are clear and acceptable'},{id:'c',text:'Only whether the vendor is headquartered in the same state'},{id:'d',text:'Whether the clause is written in plain language'}], correct:'b', rationale:'A contract calling data "de-identified" doesn\'t make it so — the actual method needs to meet the regulatory standard, and the underlying BAA governs anything that isn\'t.'},
{id:'m23-8', situation:'A hospital wants to publish aggregate, properly de-identified statistics generated by an AI analytics tool ("30% reduction in readmissions after intervention X") in a press release.',
 ask:'How should this be classified?', options:[{id:'a',text:'PHI, and requires patient authorization to publish'},{id:'b',text:'Not PHI — properly de-identified aggregate statistics fall outside the Privacy Rule\'s definition of PHI'},{id:'c',text:'Requires HHS pre-approval'},{id:'d',text:'Only permitted with a data use agreement'}], correct:'b', rationale:'Aggregate, properly de-identified statistics are not PHI and can generally be published without patient authorization.'}
],

m24: [
{id:'m24-1', situation:'A patient requests their EHI be sent electronically to a third-party app of their choosing. The hospital\'s IT team refuses, citing generic "security concerns" with no specific documented risk assessment.',
 ask:'How should this most likely be classified?', options:[{id:'a',text:'A valid Security Exception under the information blocking rule'},{id:'b',text:'Likely information blocking — the Security Exception requires specific, documented, and reasonable security practices, not a generic, undocumented objection'},{id:'c',text:'Not covered by information blocking rules since it involves a third-party app'},{id:'d',text:'A required HIPAA denial'}], correct:'b', rationale:'The information blocking exceptions have specific conditions; a vague, undocumented "security concern" doesn\'t satisfy the Security Exception\'s actual requirements.'},
{id:'m24-2', situation:'A provider withholds a specific test result from a patient\'s portal for a short, defined period because releasing it immediately, before the ordering physician can discuss it, poses a documented, reasonable risk of substantial patient harm in this specific case.',
 ask:'How should this most likely be classified?', options:[{id:'a',text:'Information blocking, with no valid exception'},{id:'b',text:'Potentially a valid Preventing Harm Exception, if the specific conditions (individualized determination, documented reasonable belief of harm) are actually met'},{id:'c',text:'Always information blocking regardless of risk'},{id:'d',text:'Irrelevant to information blocking since it involves test results'}], correct:'b', rationale:'The Preventing Harm Exception exists for exactly this kind of individualized, documented clinical judgment — but it has specific conditions that must actually be met, not just asserted.'},
{id:'m24-3', situation:'A health system\'s data-sharing agreement with a partner hospital includes a clause preventing either party from sharing patient records with a competing health system in the region, unrelated to any patient-safety or privacy justification.',
 ask:'How should this most likely be classified?', options:[{id:'a',text:'A permitted business arrangement, unrelated to information blocking'},{id:'b',text:'A likely information blocking practice — a contractual restriction on data sharing for competitive reasons, without a qualifying exception, is exactly what the rule targets'},{id:'c',text:'A required HIPAA confidentiality protection'},{id:'d',text:'Only relevant if patients complain'}], correct:'b', rationale:'Using data-sharing restrictions for competitive advantage, without a privacy or security justification meeting a defined exception, is a central information-blocking concern.'},
{id:'m24-4', situation:'A Privacy Officer instinctively tells IT "let\'s just restrict this data-sharing request to be safe," without checking whether a specific HIPAA permission or an information-blocking exception actually applies.',
 ask:'What is the risk in this instinct?', options:[{id:'a',text:'None — being cautious is always the safest choice'},{id:'b',text:'A reflexive restriction, without checking whether HIPAA actually requires it, can itself become a reportable information-blocking practice — "privacy-protective" isn\'t automatically a valid legal basis'},{id:'c',text:'It always improves patient safety'},{id:'d',text:'It removes all Security Rule obligations'}], correct:'b', rationale:'Information blocking analysis requires checking actual legal requirements, not defaulting to restriction out of general caution.'},
{id:'m24-5', situation:'A patient requests her own EHI be exported so she can share it with a specialist outside the network. IT says this will take "a few extra business days" due to a legitimate, documented system limitation affecting all such requests equally.',
 ask:'How should this most likely be classified?', options:[{id:'a',text:'Automatically information blocking due to any delay'},{id:'b',text:'Potentially a valid Infeasibility or Content and Manner Exception, if the delay is genuinely necessary, documented, and applied consistently rather than used as a pretext'},{id:'c',text:'Always permitted with no time limit'},{id:'d',text:'Irrelevant since it is the patient\'s own data'}], correct:'b', rationale:'Not every delay is information blocking — legitimate, documented, and non-discriminatory operational limitations can fit a recognized exception.'},
{id:'m24-6', situation:'A hospital charges patients an unusually high fee specifically for electronic EHI exports to competing providers, while providing free exports to its own affiliated network.',
 ask:'How should this most likely be classified?', options:[{id:'a',text:'A permitted fee under HIPAA\'s cost-based access-fee standard'},{id:'b',text:'Likely information blocking — a discriminatory fee structure designed to favor the hospital\'s own network over competitors is a recognized concern under the rule'},{id:'c',text:'Not relevant to information blocking since fees are a HIPAA-only issue'},{id:'d',text:'Always acceptable if disclosed in advance'}], correct:'b', rationale:'Fee structures that discriminate based on the destination of the data (favoring the entity\'s own network) raise both HIPAA fee-reasonableness and information-blocking concerns.'}
],

m26: [
{id:'m26-1', situation:'A Manila-based health information management company processes medical records for a U.S. hospital chain under a signed Business Associate Agreement. It has never registered a Data Protection Officer with the NPC, reasoning that "we\'re a HIPAA Business Associate, not a Philippine health provider."',
 ask:'Is that reasoning correct?', options:[
   {id:'a',text:'Correct — HIPAA Business Associate status exempts the company from RA 10173'},
   {id:'b',text:'Incorrect — RA 10173 applies to any personal information controller/processor handling PH-linked personal data, and a company operating and employing staff in the Philippines is independently subject to it, regardless of its separate HIPAA Business Associate obligations'},
   {id:'c',text:'Correct, but only because the patients are American, not Filipino'},
   {id:'d',text:'Incorrect only if the company has 250+ employees'}],
 correct:'b', authorityKey:'ph_dpa_statute',
 rationale:'RA 10173 and HIPAA are two independent legal regimes that can both apply to the exact same data at the exact same time. Being a HIPAA Business Associate doesn\'t opt a Philippine-based company out of its own, separate NPC obligations — and the DPO/registration requirement turns on the organization\'s own size/processing volume, not on its clients\' nationality.'},
{id:'m26-2', situation:'A Quezon City hospital wants to disclose a patient\'s lab results to another physician at the same hospital for ongoing treatment, without a signed consent form on file.',
 ask:'Under RA 10173, is this disclosure permitted?', options:[
   {id:'a',text:'No — RA 10173 has no treatment-purpose exception; consent is always required first'},
   {id:'b',text:'Yes — Section 13(e) permits processing sensitive personal information necessary for medical treatment carried out by a medical practitioner or institution, with adequate protection ensured'},
   {id:'c',text:'Only permitted if the NPC pre-approves the disclosure'},
   {id:'d',text:'Only permitted if the patient is a NPC-registered data subject'}],
 correct:'b', authorityKey:'ph_dpa_statute',
 rationale:'Section 13(e)\'s medical-treatment exception is RA 10173\'s rough equivalent to HIPAA\'s treatment permission — both let clinical care proceed without a signed authorization/consent, though RA 10173 frames it as a specific listed exception to an otherwise consent-required default, while HIPAA frames treatment as affirmatively permitted from the start.'},
{id:'m26-3', situation:'A hospital in Cebu discovers that an unencrypted laptop containing 4,000 patients\' records (names, diagnoses, contact details) was stolen from an employee\'s car. It is now 40 hours since the hospital\'s IT team learned of the theft.',
 ask:'What does RA 10173 require, and by when?', options:[
   {id:'a',text:'Nothing yet — RA 10173 allows up to 60 days like HIPAA'},
   {id:'b',text:'The hospital must notify the NPC and the affected patients within 72 hours of knowledge of the breach — it has roughly 32 hours left, and delay is not permitted given the scale (over 100 individuals) and sensitivity of the data'},
   {id:'c',text:'Only the NPC needs to be notified; patients are optional'},
   {id:'d',text:'Notification is only required if the laptop is recovered and confirmed accessed'}],
 correct:'b', authorityKey:'ph_npc_breach_circular',
 rationale:'This is the single sharpest operational contrast between the two laws: RA 10173\'s 72-hour concurrent-notification clock (NPC Circular 16-03) is dramatically faster than HIPAA\'s 60-day outer limit, and with over 100 affected individuals plus sensitive personal information involved, delay is explicitly not permitted.'},
{id:'m26-4', situation:'A clinic\'s Data Protection Officer wants to know whether HIPAA\'s "minimum necessary" standard has a direct RA 10173 equivalent.',
 ask:'What is the most accurate answer?', options:[
   {id:'a',text:'RA 10173 has no comparable principle at all'},
   {id:'b',text:'RA 10173\'s general data privacy principles (transparency, legitimate purpose, and proportionality) function similarly — processing must be adequate, relevant, and not excessive relative to its declared purpose, even though it is not called "minimum necessary"'},
   {id:'c',text:'RA 10173 only applies proportionality to government agencies'},
   {id:'d',text:'Proportionality only applies after a breach has occurred'}],
 correct:'b', authorityKey:'ph_dpa_irr',
 rationale:'Different vocabulary, similar underlying idea — RA 10173\'s "proportionality" principle and HIPAA\'s "minimum necessary" both push toward scoping data use/disclosure to what a specific purpose actually requires.'},
{id:'m26-5', situation:'A patient information sheet at a Manila hospital lists only the patient\'s spouse as an authorized representative. The patient\'s adult sibling calls asking for a bedside update while the patient is unconscious after surgery.',
 ask:'How should hospital staff most defensibly proceed?', options:[
   {id:'a',text:'Refuse absolutely, since only the listed spouse may ever receive information'},
   {id:'b',text:'Consider Section 13(c) — processing necessary to protect the life and health of the data subject when they cannot give consent — while still exercising judgment about what limited information is appropriate to share with an unlisted relative, similar to how HIPAA allows disclosure to family based on professional judgment and the patient\'s presence/incapacity'},
   {id:'c',text:'Share the complete chart with anyone claiming to be family'},
   {id:'d',text:'Wait for the NPC to issue a ruling before saying anything'}],
 correct:'b', authorityKey:'ph_dpa_statute',
 rationale:'Section 13(c)\'s "life and health" exception for an incapacitated data subject is conceptually close to HIPAA\'s allowance for disclosures to family involved in care based on professional judgment — both frameworks build in flexibility for exactly this kind of situation, without treating it as a blank check.'},
{id:'m26-6', situation:'An NPC-registered hospital wants to outsource its billing function to a third-party processor. Its compliance team asks whether a HIPAA-style Business Associate Agreement satisfies RA 10173.',
 ask:'What is the most accurate answer?', options:[
   {id:'a',text:'Yes, a BAA is automatically sufficient under both laws'},
   {id:'b',text:'A BAA addresses HIPAA obligations, but the hospital (as Personal Information Controller) remains independently accountable to the NPC and should ensure its outsourcing/data-sharing agreement with the processor meets RA 10173\'s own requirements — the two documents serve overlapping but legally distinct purposes'},
   {id:'c',text:'No agreement is needed under RA 10173 as long as HIPAA is satisfied'},
   {id:'d',text:'RA 10173 prohibits all outsourcing of billing functions'}],
 correct:'b', authorityKey:'ph_dpa_irr',
 rationale:'A single well-drafted agreement can often cover both frameworks\' substantive requirements, but they are legally separate obligations — satisfying HIPAA\'s BAA rules does not, by itself, satisfy RA 10173\'s controller-accountability and processor-agreement expectations.'},
{id:'m26-7', situation:'A telehealth startup based in Cebu wants to know if RA 10173 reaches a Filipino patient\'s data if the company\'s servers are physically hosted in another country.',
 ask:'What is the most accurate answer?', options:[
   {id:'a',text:'No — RA 10173 only applies to data physically stored within the Philippines'},
   {id:'b',text:'Yes — RA 10173 is explicitly extraterritorial (Section 6) and reaches processing involving Philippine citizens\' or residents\' personal data even when carried out abroad'},
   {id:'c',text:'Only if the servers are owned by a Philippine company'},
   {id:'d',text:'RA 10173 never applies to telehealth'}],
 correct:'b', authorityKey:'ph_dpa_statute',
 rationale:'RA 10173\'s extraterritorial reach is broader in this specific respect than HIPAA\'s — HIPAA\'s applicability turns on covered-entity/Business Associate status, not on the nationality/residency of the patient whose data is processed.'},
{id:'m26-8', situation:'A hospital\'s newly appointed Data Protection Officer asks how quickly they must register with the NPC.',
 ask:'What is the correct answer under current NPC rules?', options:[
   {id:'a',text:'There is no registration requirement for DPOs in the Philippines'},
   {id:'b',text:'Within 20 working days of appointment, per NPC Circular No. 2022-04 (assuming the organization meets the registration thresholds)'},
   {id:'c',text:'Only once a data breach has occurred'},
   {id:'d',text:'Within 5 years of the organization\'s founding'}],
 correct:'b', authorityKey:'ph_npc_registration_circular',
 rationale:'Unlike HIPAA — which requires a Privacy Officer by function but does not involve registering that person with OCR — RA 10173\'s DPO role includes a specific, time-bound NPC registration step for organizations meeting the size/processing thresholds.'},
{id:'m26-9', situation:'A researcher wants to use fully de-identified Philippine patient records (Safe-Harbor-equivalent, all direct identifiers removed) for a public health study, without individual consent.',
 ask:'How should this be evaluated under RA 10173?', options:[
   {id:'a',text:'Prohibited — RA 10173 requires consent for all research use of health data, de-identified or not'},

{id:'m26-10', situation:'A U.S. health plan\'s Philippine-based customer service subsidiary suffers a breach exposing call recordings containing plan members\' health information. Most affected members are U.S. residents; a handful are Philippine residents who work for the U.S. company remotely.',

   {id:'d',text:'Wait for one regulator to claim jurisdiction before doing anything'}],

{id:'m26-12', situation:'A hospital administrator asks whether Philippine law requires anything like HIPAA\'s Notice of Privacy Practices.',

 ],

{id:'m9-2', doc:true, multi:true,

 options:[

 ],

{ id:'rw9', title:'Philippines — Data Privacy Act of 2012 (RA 10173): baseline status', status:'effective',

  diagnosticAnswers: {}, // qid -> {selected, correct} — deliberately kept OUT of domainStats; ungraded baseline only
  assessSample: {},     // moduleId -> [ids] (cached random sample for large banks)
  assessScores: {},     // moduleId -> pct
  assessAttempts: {},   // moduleId -> count
  assessDone: {},        // moduleId -> bool (current sample fully scored)
  moduleTab: {},         // moduleId -> 'learn'|'practice'|'assess'
  whatChangedSeen: [],
  lastModule: null,
  researchDeskRevealed: {}, // caseId -> bool
  docLabRevealed: {},        // docId(dl-1 etc.) shares answers already; separate flag not needed
  ui: {}                     // ephemeral, never persisted: current item index, in-progress multi-select picks, etc.
};

var _saveTimer = null;
function scheduleSave(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(persistState, 500);
}
function snapshotState(){
  return {
    answers: state.answers, freetext: state.freetext, workflowProgress: state.workflowProgress,
    registerSel: state.registerSel, reportRevealed: state.reportRevealed, briefingRevealed: state.briefingRevealed,
    rubricChecks: state.rubricChecks, capstone: state.capstone, diagnosticDone: state.diagnosticDone,
    diagnosticAnswers: state.diagnosticAnswers,
    assessScores: state.assessScores, assessAttempts: state.assessAttempts, assessDone: state.assessDone, whatChangedSeen: state.whatChangedSeen,
    lastModule: state.lastModule, researchDeskRevealed: state.researchDeskRevealed, assessSample: state.assessSample
  };
}
function applySnapshotJSON(json){
  try{
    var saved = JSON.parse(json);
    Object.keys(saved).forEach(function(k){ state[k] = saved[k]; });
  }catch(e){ /* ignore corrupt/unreadable saved state */ }
}
function persistState(){
  if(STORAGE_MODE==='none') return;
  var json = JSON.stringify(snapshotState());
  if(STORAGE_MODE==='claude'){
    try{ window.storage.set(STORAGE_KEY, json, false); }catch(e){ /* non-fatal */ }
  } else if(STORAGE_MODE==='local'){
    try{ window.localStorage.setItem(STORAGE_KEY, json); }catch(e){ /* non-fatal, e.g. quota/private mode */ }
  }
}
function loadState(){
  if(STORAGE_MODE==='claude'){
    window.storage.get(STORAGE_KEY, false).then(function(res){
      if(res && res.value) applySnapshotJSON(res.value);
      render();
    }).catch(function(){ render(); });
  } else if(STORAGE_MODE==='local'){
    try{
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw) applySnapshotJSON(raw);
    }catch(e){ /* non-fatal */ }
    render();
  } else {
    render();
  }
}

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pct(n,d){ if(!d) return 0; return Math.round((n/d)*100); }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

function recordAnswer(key, correct, domain, selected){
  state.answers[key] = { correct: !!correct, domain: domain||null, selected: selected, ts: Date.now() };
  scheduleSave();
}
function isAnswered(key){ return !!state.answers[key]; }
function answerOf(key){ return state.answers[key]; }

function domainStats(domainKey){
  var total=0, correct=0;
  Object.keys(state.answers).forEach(function(k){
    var a = state.answers[k];
    if(a.domain===domainKey){ total++; if(a.correct) correct++; }
  });
  return { total:total, correct:correct, pct: total? pct(correct,total): null };
}
function readinessIndex(){
  var keys = Object.keys(DOMAINS);
  var sum = 0;
  keys.forEach(function(k){ var s = domainStats(k); sum += (s.pct===null?0:s.pct); });
  return Math.round(sum/keys.length);
}
function readinessBand(score){
  if(score>=95) return 'Expert Simulation Performance';
  if(score>=85) return 'Advanced Practitioner';
  if(score>=75) return 'Entry-Level Privacy/Compliance Ready';
  if(score>=60) return 'Foundational Practitioner';
  if(score>=40) return 'Developing';
  return 'Beginner';
}

// Returns the list of answer-key ids that "belong" to a module, for progress/score display.
function moduleItemIds(mod){
  switch(mod.practice){
    case 'classify': return PHI_ITEMS.map(function(i){return i.id;});
    case 'scenario': return (SCENARIO_BANKS[mod.dataKey]||[]).map(function(i){return i.id;});
    case 'fourfactor':
      var ids=[];
      FOURFACTOR_CASES.forEach(function(c){ c.factors.forEach(function(f){ ids.push(c.id+'-'+f.key); }); ids.push(c.id+'-final'); });
      return ids;
    case 'workflow':
      var wids=[];
      (WORKFLOW_CASES[mod.dataKey].cases||[]).forEach(function(c){ c.stages.forEach(function(s){ if(s.decision) wids.push(c.id+'-'+s.key); }); });
      return wids;
    case 'register': return RISK_REGISTER_EXERCISE.rows.map(function(r){return r.id+'-rate';});
    case 'map': return (MODULE1_MAP.matching||[]).map(function(m,i){return 'map-'+i;});
    case 'research': return STATE_LAW_CASE.questions.filter(function(q){return q.type==='mc';}).map(function(q){return 'sl-'+q.key;});
    case 'capstone': return CAPSTONE.events.map(function(e){return 'cap-'+e.id;});
    case 'report': return OCR_CASE.rubric.map(function(_,i){return 'report-rubric-'+i;});
    case 'briefing': return EXEC_BRIEFING_CASE.rubric.map(function(_,i){return 'brief-rubric-'+i;});
    default: return [];
  }
}
function moduleStats(mod){
  var ids = moduleItemIds(mod);
  var attempted=0, correct=0;
  ids.forEach(function(id){ if(state.answers[id]){ attempted++; if(state.answers[id].correct) correct++; } });
  return { total: ids.length, attempted: attempted, correct: correct, pct: attempted? pct(correct,attempted): 0 };
}
function usesFreeTextOnly(mod){ return mod.practice==='report' || mod.practice==='briefing'; }
function moduleHasAssessTab(mod){ return mod.practice==='scenario' || mod.practice==='classify'; }

function getAssessItemIds(mod){
  var all = mod.practice==='classify' ? PHI_ITEMS.map(function(i){return i.id;}) : (SCENARIO_BANKS[mod.dataKey]||[]).map(function(i){return i.id;});
  if(all.length<=16) return all;
  if(state.assessSample[mod.id]) return state.assessSample[mod.id];
  var s = sample(all,15);
  state.assessSample[mod.id]=s; scheduleSave();
  return s;
}
