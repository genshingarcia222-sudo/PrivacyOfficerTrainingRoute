<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Officer Command — HIPAA &amp; RA 10173 Health Privacy Training</title>
<meta name="description" content="A free, self-contained, in-browser HIPAA Privacy Officer training simulator: 26 modules (including a dedicated HIPAA-vs-Philippine Data Privacy Act comparison), interactive case work, a living regulatory-status tracker, and no backend required.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231B2430'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23F1E4BE' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --ink-2:#252F3D; --ink-soft:#3E4A5C;
  --paper:#F1F1EA; --paper-deep:#E6E6DB; --card:#FFFFFF;
  --line:#D9DACE; --line-soft:#EAEAE0;
  --text:#20262E; --text-muted:#5B6570; --text-faint:#8A9099;
  --brass:#93701F; --brass-bg:#F3E9CE; --brass-line:#D8C48C;
  --focus:#2B5F8C;

  --s-effective:#2F6844; --s-effective-bg:#E1EDE5; --s-effective-line:#B9D3C1;
  --s-future:#1F6F78; --s-future-bg:#DFEDEE; --s-future-line:#B4D4D6;
  --s-proposed:#8C5E17; --s-proposed-bg:#F2E7CE; --s-proposed-line:#DEC58C;
  --s-vacated:#96302F; --s-vacated-bg:#F3E1E0; --s-vacated-line:#DFB4B2;
  --s-litigation:#5F4489; --s-litigation-bg:#E7E1F0; --s-litigation-line:#C7B7DE;
  --s-guidance:#33578A; --s-guidance-bg:#E0E7F0; --s-guidance-line:#B7C7DE;
  --s-practice:#4E5862; --s-practice-bg:#E6E7E2; --s-practice-line:#C7C9BF;
  --s-professional:#71603F; --s-professional-bg:#EDE7D8; --s-professional-line:#D2C4A0;

  --serif:'Source Serif 4', Georgia, 'Iowan Old Style', ui-serif, serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, Helvetica, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius:4px; --radius-lg:8px;
  --shadow:0 1px 2px rgba(20,24,30,.06), 0 1px 1px rgba(20,24,30,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--text); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; color:var(--ink); margin:0 0 .5em; letter-spacing:-0.01em}
p{margin:0 0 1em}
a{color:var(--focus)}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
::selection{background:var(--brass-bg)}

/* ---------- layout ---------- */
.app-shell{display:flex; min-height:100vh}
.sidebar{
  width:252px; flex-shrink:0; background:var(--ink); color:#CDD3DA;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column;
}
.brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{font-family:var(--serif); font-size:17px; color:#F4F0E4; font-weight:600; line-height:1.25}
.brand-sub{font-size:11.5px; color:#8993A1; margin-top:4px; letter-spacing:.02em}
.nav-group{padding:14px 12px 6px}
.nav-group-label{font-size:11px; color:#7A8391; padding:0 10px 6px; letter-spacing:.02em}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border-radius:var(--radius); border:none; background:transparent;
  color:#C4CAD2; font-size:13.5px; font-weight:500; margin-bottom:1px;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#F1F0E9}
.nav-item.active{background:rgba(233,222,180,.14); color:#F1E4BE}
.nav-icon{width:16px; height:16px; flex-shrink:0; opacity:.85}
.nav-item.active .nav-icon{opacity:1}
.sidebar-foot{margin-top:auto; padding:16px 20px; border-top:1px solid rgba(255,255,255,.08)}
.readiness-mini{display:flex; align-items:center; gap:10px}
.readiness-mini .num{font-family:var(--serif); font-size:22px; color:#F4F0E4; font-weight:600}
.readiness-mini .lbl{font-size:11px; color:#8993A1; line-height:1.35}

.main{flex:1; min-width:0}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:14px 32px; border-bottom:1px solid var(--line); background:var(--paper);
  position:sticky; top:0; z-index:20;
}
.topbar-title{font-size:13px; color:var(--text-muted)}
.content{padding:30px 32px 90px; max-width:980px}
.content-wide{padding:30px 32px 90px; max-width:1180px}

/* ---------- typography helpers ---------- */
.eyebrow{font-size:12px; color:var(--text-muted); font-weight:600; margin-bottom:6px}
.lede{font-size:16px; color:var(--text-muted); max-width:66ch; font-family:var(--serif)}
.prose{max-width:70ch; font-family:var(--serif); font-size:16.5px; color:var(--text)}
.prose p{margin:0 0 1em}
.prose ul,.prose ol{margin:0 0 1em; padding-left:1.3em}
.prose li{margin-bottom:.35em}
.prose strong{color:var(--ink)}
.muted{color:var(--text-muted)}
.small{font-size:12.5px}
.mono{font-family:var(--mono)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:9px 16px; font-size:13.5px;
  font-weight:600; border-radius:var(--radius); border:1px solid transparent; background:var(--ink);
  color:#F4F1E8; transition:background .12s ease;
}
.btn:hover{background:var(--ink-2)}
.btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink)}
.btn-outline:hover{background:var(--card); border-color:var(--ink-soft)}
.btn-brass{background:var(--brass); color:#FBF4E2}
.btn-brass:hover{background:#7C5C18}
.btn-ghost{background:transparent; color:var(--focus); padding:6px 4px; font-weight:600}
.btn-sm{padding:6px 11px; font-size:12.5px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-row{display:flex; gap:10px; flex-wrap:wrap}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px}
.card + .card{margin-top:14px}
.card-tight{padding:14px 16px}
.grid{display:grid; gap:14px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.ring-grid{grid-template-columns:repeat(5,1fr)}
@media (max-width:880px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .ring-grid{grid-template-columns:repeat(3,1fr) !important}
}

/* ---------- status badges ---------- */
.badge{
  display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px;
  font-size:11.5px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge-effective{background:var(--s-effective-bg); color:var(--s-effective); border-color:var(--s-effective-line)}
.badge-effective .badge-dot{background:var(--s-effective)}
.badge-future{background:var(--s-future-bg); color:var(--s-future); border-color:var(--s-future-line)}
.badge-future .badge-dot{background:var(--s-future)}
.badge-proposed{background:var(--s-proposed-bg); color:var(--s-proposed); border-color:var(--s-proposed-line)}
.badge-proposed .badge-dot{background:var(--s-proposed)}
.badge-vacated{background:var(--s-vacated-bg); color:var(--s-vacated); border-color:var(--s-vacated-line)}
.badge-vacated .badge-dot{background:var(--s-vacated)}
.badge-litigation{background:var(--s-litigation-bg); color:var(--s-litigation); border-color:var(--s-litigation-line)}
.badge-litigation .badge-dot{background:var(--s-litigation)}
.badge-guidance{background:var(--s-guidance-bg); color:var(--s-guidance); border-color:var(--s-guidance-line)}
.badge-guidance .badge-dot{background:var(--s-guidance)}
.badge-practice{background:var(--s-practice-bg); color:var(--s-practice); border-color:var(--s-practice-line)}
.badge-practice .badge-dot{background:var(--s-practice)}
.badge-professional{background:var(--s-professional-bg); color:var(--s-professional); border-color:var(--s-professional-line)}
.badge-professional .badge-dot{background:var(--s-professional)}
.badge-neutral{background:var(--line-soft); color:var(--text-muted); border-color:var(--line)}

.status-key{display:flex; flex-wrap:wrap; gap:7px 10px; margin:10px 0 4px}

/* ---------- authority / citation ---------- */
.authority-btn{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  color:var(--brass); background:var(--brass-bg); border:1px solid var(--brass-line);
  padding:5px 10px; border-radius:var(--radius);
}
.authority-btn:hover{background:#EADFB9}
.authority-seal{font-family:var(--mono); font-size:10px}

/* ---------- competency rings ---------- */
.ring-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.ring-num{font-family:var(--serif); font-size:15px; font-weight:600; fill:var(--ink)}
.ring-label{font-size:11.5px; color:var(--text-muted); max-width:100px; line-height:1.3}

/* ---------- progress bar ---------- */
.pbar{height:6px; border-radius:100px; background:var(--line-soft); overflow:hidden}
.pbar > span{display:block; height:100%; background:var(--ink); border-radius:100px}

/* ---------- tables ---------- */
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{color:var(--text-muted); font-weight:600; font-size:11.5px; text-transform:none; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px}
.tab{
  padding:10px 6px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--text-muted);
  border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab.active{color:var(--ink); border-bottom-color:var(--brass)}

/* ---------- module / case cards ---------- */
.mod-card{display:flex; flex-direction:column; gap:10px}
.mod-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.mod-title{font-family:var(--serif); font-size:16.5px; font-weight:600; color:var(--ink)}
.mod-meta{font-size:12px; color:var(--text-muted)}
.level-tag{font-size:11px; font-weight:700; color:var(--text-faint); letter-spacing:.03em}

/* ---------- quiz ---------- */
.option-btn{
  display:block; width:100%; text-align:left; padding:12px 14px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--card); margin-bottom:8px; font-size:14px; color:var(--text);
}
.option-btn:hover{border-color:var(--ink-soft)}
.option-btn.selected{border-color:var(--focus); background:#EAF1F8}
.option-btn.correct{border-color:var(--s-effective); background:var(--s-effective-bg); color:var(--s-effective)}
.option-btn.incorrect{border-color:var(--s-vacated); background:var(--s-vacated-bg); color:var(--s-vacated)}
.option-btn[disabled]{cursor:default}
.feedback-box{padding:14px 16px; border-radius:var(--radius); margin:12px 0; font-size:14px}
.feedback-correct{background:var(--s-effective-bg); border:1px solid var(--s-effective-line); color:#1E4A30}
.feedback-incorrect{background:var(--s-vacated-bg); border:1px solid var(--s-vacated-line); color:#6E2422}
.feedback-info{background:var(--s-guidance-bg); border:1px solid var(--s-guidance-line); color:#1F3A5C}

/* ---------- forms ---------- */
textarea,input[type=text]{
  width:100%; font-family:var(--sans); font-size:14px; padding:10px 12px; border:1px solid var(--line);
  border-radius:var(--radius); background:var(--card); color:var(--text);
}
textarea{resize:vertical; min-height:110px; line-height:1.5}
label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:5px}
.field{margin-bottom:16px}

/* ---------- misc ---------- */
.hr{height:1px; background:var(--line); border:none; margin:22px 0}
.pill-row{display:flex; gap:8px; flex-wrap:wrap}
.divider-label{display:flex; align-items:center; gap:10px; margin:26px 0 14px; color:var(--text-muted); font-size:12px; font-weight:600}
.divider-label::after{content:''; flex:1; height:1px; background:var(--line)}
.kv{display:grid; grid-template-columns:140px 1fr; gap:4px 12px; font-size:13.5px}
.kv dt{color:var(--text-muted)}
.kv dd{margin:0}
.callout{border-left:3px solid var(--brass); background:var(--brass-bg); padding:12px 16px; border-radius:0 var(--radius) var(--radius) 0; font-size:13.5px}
.callout-neutral{border-left:3px solid var(--ink-soft); background:var(--line-soft); padding:12px 16px; border-radius:0 var(--radius) var(--radius) 0; font-size:13.5px}
.callout-ph{border:1px solid var(--s-guidance-line); background:var(--s-guidance-bg); border-radius:var(--radius); padding:14px 16px; margin:18px 0; font-size:13.5px}
.ph-compare-label{font-weight:700; color:var(--s-guidance); font-size:12.5px; margin-bottom:10px; letter-spacing:.01em}
.compare-table{background:var(--card); border-radius:var(--radius); overflow:hidden}
.compare-table th{background:var(--line-soft)}
.compare-table td{font-size:13px; line-height:1.5; vertical-align:top}
.compare-table td:first-child{white-space:nowrap; color:var(--text-muted)}
.step-track{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px}
.step-chip{padding:5px 10px; border-radius:100px; font-size:11.5px; font-weight:600; background:var(--line-soft); color:var(--text-muted)}
.step-chip.done{background:var(--s-effective-bg); color:var(--s-effective)}
.step-chip.wrong{background:var(--s-vacated-bg); color:var(--s-vacated)}
.step-chip.current{background:var(--ink); color:#F4F1E8}

/* ---------- modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,24,30,.55); display:flex; align-items:flex-start;
  justify-content:center; padding:6vh 20px; z-index:100; overflow-y:auto;
}
.modal{background:var(--card); border-radius:var(--radius-lg); max-width:640px; width:100%; padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px}
.modal-close{background:none; border:none; font-size:20px; color:var(--text-muted); line-height:1; padding:2px 6px}

/* ---------- portfolio / doc viewer ---------- */
.doc-frame{background:#FBFAF6; border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; font-family:var(--serif); font-size:14px; line-height:1.65}

/* ---------- diagrams ---------- */
.diagram-wrap{margin:18px 0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px}
.diagram-wrap svg{display:block}
.diagram-wrap figcaption{text-align:center}

/* ---------- responsive ---------- */
@media (max-width:760px){
  .app-shell{flex-direction:column}
  .sidebar{position:relative; width:100%; height:auto; flex-direction:row; overflow-x:auto; padding:0}
  .brand{display:none}
  .nav-group{display:flex; gap:4px; padding:10px; white-space:nowrap}
  .nav-group-label{display:none}
  .sidebar-foot{display:none}
  .content,.content-wide{padding:20px 16px 70px}
  .topbar{padding:12px 16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================================================
   PRIVACY OFFICER COMMAND — DATA LAYER
   Training content lives here, separate from application/rendering logic below, so that new
   legislation, court decisions, state laws, HHS guidance, or certification updates can be
   added without touching the UI code. See the "EXTENDING THIS APP" note near the bottom of
   the data layer for how to add new modules, cases, or regulatory-watch entries.
   ========================================================================================= */

var APP_BUILD_DATE = "2026-09-06"; // the date this training content was last verified/updated

// ---------------------------------------------------------------------------------------
// Eight-category regulatory status taxonomy. Every legal proposition in this app is tagged
// with one of these. Never treat two different categories as carrying equal legal weight.
// ---------------------------------------------------------------------------------------
var REG_STATUS = {
  effective:     { key:'effective',     label:'Currently Effective Law',            cls:'badge-effective',
                   help:'A statute or regulation currently in force and enforceable.' },
  future:        { key:'future',        label:'Effective, Future Compliance Date',   cls:'badge-future',
                   help:'A final rule that is legally effective but whose compliance date has not yet arrived — not yet enforceable on that basis.' },
  proposed:      { key:'proposed',      label:'Proposed Rule',                       cls:'badge-proposed',
                   help:'A proposal (e.g. an NPRM) that is NOT currently binding law, no matter how likely it looks to be finalized.' },
  vacated:       { key:'vacated',       label:'Vacated / Invalidated',               cls:'badge-vacated',
                   help:'A provision that a court has removed or rendered unenforceable.' },
  litigation:    { key:'litigation',    label:'Court-Limited / Under Litigation',    cls:'badge-litigation',
                   help:'A rule whose application has been narrowed, enjoined, or is actively being contested in court.' },
  guidance:      { key:'guidance',      label:'Agency Guidance',                     cls:'badge-guidance',
                   help:'HHS/OCR/SAMHSA/ONC/FTC material that explains requirements but is not itself the equivalent of a regulation.' },
  best_practice: { key:'best_practice', label:'Industry Best Practice',              cls:'badge-practice',
                   help:'A recommended operational practice that goes beyond the legal minimum.' },
  professional:  { key:'professional',  label:'Professional / Ethical Consideration', cls:'badge-professional',
                   help:'A matter of professional judgment rather than a direct statutory or regulatory command.' }
};

function statusBadge(key, opts){
  var s = REG_STATUS[key]; if(!s) return '';
  var big = opts && opts.big;
  return '<span class="badge '+s.cls+'"'+(big?' style="padding:5px 12px;font-size:12.5px"':'')+'>'+
         '<span class="badge-dot"></span>'+s.label+'</span>';
}

function statusKey(){
  var out = '<div class="status-key">';
  Object.keys(REG_STATUS).forEach(function(k){ out += statusBadge(k); });
  out += '</div>';
  return out;
}

// ---------------------------------------------------------------------------------------
// AUTHORITIES — citation objects reused by "Authority" buttons throughout the app.
// Sources favor primary law (U.S. Code / CFR / Federal Register / court opinions / HHS)
// over secondary commentary, per the authoritative source hierarchy. Secondary articles
// are included only as "further reading" and are real, verifiable URLs — never invented.
// ---------------------------------------------------------------------------------------
var AUTHORITIES = {
  hipaa_statute: {
    title:'Health Insurance Portability and Accountability Act of 1996',
    source:'U.S. Code', citation:'42 U.S.C. § 1320d et seq.; Pub. L. 104-191',
    date:'Enacted Aug. 21, 1996', status:'effective',
    url:'https://www.govinfo.gov/app/collection/USCODE',
    why:'The underlying statute. The Privacy, Security, Breach Notification, and Enforcement Rules are all regulations HHS issued under authority Congress granted here (as later amended by HITECH).'
  },
  privacy_rule: {
    title:'Standards for Privacy of Individually Identifiable Health Information (the Privacy Rule)',
    source:'HHS Office for Civil Rights (OCR)', citation:'45 C.F.R. Parts 160 and 164, Subparts A and E',
    date:'Original final rule 2000; compliance 2003; amended by HITECH (2013 Omnibus Rule)', status:'effective',
    url:'https://www.hhs.gov/hipaa/for-professionals/privacy/index.html',
    why:'The core regulation governing uses and disclosures of PHI, minimum necessary, patient rights, NPPs, and Business Associate requirements. HHS.gov is OCR\'s own professional-facing hub for this rule — the primary source this course points to first, with the eCFR as the underlying regulatory text.'
  },
  security_rule: {
    title:'Security Standards for the Protection of Electronic Protected Health Information (the Security Rule)',
    source:'HHS Office for Civil Rights (OCR)', citation:'45 C.F.R. Part 164, Subpart C',
    date:'Original final rule 2003; amended by HITECH (2013 Omnibus Rule)', status:'effective',
    url:'https://www.hhs.gov/hipaa/for-professionals/security/index.html',
    why:'Sets administrative, physical, and technical safeguard requirements for ePHI. This is the rule currently in force — distinct from the 2025 proposed modernization (see Regulatory Watch). HHS.gov is OCR\'s own hub for this rule.'
  },
  breach_rule: {
    title:'Notification in the Case of Breach of Unsecured Protected Health Information',
    source:'HHS Office for Civil Rights (OCR)', citation:'45 C.F.R. §§ 164.400–414',
    date:'Interim final rule 2009 (HITECH); finalized 2013', status:'effective',
    url:'https://www.hhs.gov/hipaa/for-professionals/breach-notification/index.html',
    why:'Defines "breach," the four-factor risk assessment, and notification timing/content obligations to individuals, HHS, and (for large breaches) media. HHS.gov is OCR\'s own hub for this rule, including the breach portal referenced in Module 12.'
  },
  enforcement_rule: {
    title:'HIPAA Enforcement Rule',
    source:'HHS Office for Civil Rights (OCR)', citation:'45 C.F.R. Part 160, Subparts C, D, E',
    date:'2006; penalty tiers updated by HITECH (2009) and inflation adjustments since', status:'effective',
    url:'https://www.hhs.gov/hipaa/for-professionals/compliance-enforcement/index.html',
    why:'Governs OCR investigations, civil monetary penalty tiers, and hearing procedures. HHS.gov also publishes OCR\'s enforcement highlights and resolution agreements referenced in Module 17.'
  },
  hhs_hipaa_home: {
    title:'HHS.gov — HIPAA Home (Office for Civil Rights)',
    source:'HHS Office for Civil Rights (OCR)', citation:'N/A — primary agency web portal, not a regulatory citation itself',
    date:'Maintained on an ongoing basis by OCR', status:'guidance',
    url:'https://www.hhs.gov/hipaa/index.html',

// COMPARISON TABLE — a lightweight helper for side-by-side HIPAA vs. RA 10173 callouts,
// used throughout the Learn content below and in the dedicated Module 26.

function usPhCompareTable(rows, opts){
  opts = opts || {};
  var h = '<div class="callout-ph">';
  h += '<div class="ph-compare-label">\uD83C\uDDFA\uD83C\uDDF8 \u2194 \uD83C\uDDF5\uD83C\uDDED '+(opts.title||'US \u2013 Philippines Comparison')+'</div>';
  h += '<table class="compare-table"><thead><tr><th>Dimension</th><th>HIPAA (United States)</th><th>RA 10173 (Philippines)</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td><strong>'+escapeHtml(r[0])+'</strong></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

{ id:1, level:1, title:'HIPAA Architecture', domain:'foundational', practice:'map', dataKey:'m1',
  authorityKeys:['hhs_hipaa_home','hipaa_statute','privacy_rule','security_rule','breach_rule','enforcement_rule','hitech','ph_dpa_statute'],
  blurb:'How HIPAA, HITECH, and the four operating rules fit together — and who OCR actually regulates.',
  learnHtml:
    '<p><strong>HIPAA</strong> (1996) is a statute, not a single rule. Congress told HHS to write regulations '+
    'protecting the privacy and security of health information; HHS did that through four rules that a Privacy '+
    'Officer has to keep straight, because they impose different obligations and have different histories:</p>'+
    '<ul>'+
    '<li><strong>Privacy Rule</strong> (45 C.F.R. Parts 160 &amp; 164, Subpart E) — governs uses and disclosures of PHI, minimum necessary, patient rights, and Notices of Privacy Practices.</li>'+
    '<li><strong>Security Rule</strong> (Subpart C) — administrative, physical, and technical safeguards for <em>electronic</em> PHI specifically.</li>'+
    '<li><strong>Breach Notification Rule</strong> (Subpart D) — added by HITECH in 2009; requires notification after impermissible acquisition, access, use, or disclosure of unsecured PHI.</li>'+
    '<li><strong>Enforcement Rule</strong> (Part 160, Subparts C–E) — how OCR investigates and penalizes.</li>'+
    '</ul>'+
    diagramBranch('HIPAA (1996) + HITECH (2009)', ['Privacy Rule','Security Rule','Breach Notification Rule','Enforcement Rule'], {outputLabel:'Enforced by HHS OCR', caption:'HIPAA architecture: one statute (amended by HITECH), four operating rules, one enforcer.'})+
    '<p><strong>HITECH</strong> (2009) is the amendment that made Business Associates directly liable under HIPAA for the first time, created the Breach Notification Rule, and raised penalty tiers. The 2013 "Omnibus Rule" is where HHS folded most of HITECH into the existing regulatory text.</p>'+
    '<p>HIPAA only regulates two kinds of entities: <strong>covered entities</strong> (health plans, health care clearinghouses, and health care providers who transmit health information electronically in connection with a covered transaction) and their <strong>Business Associates</strong> (persons/entities that create, receive, maintain, or transmit PHI on a covered entity\'s behalf). If an organization is neither, HIPAA generally does not apply to it directly — even if it is handling health information (this is exactly why the FTC Health Breach Notification Rule and state consumer-health-data laws exist to fill that gap; see Regulatory Watch).</p>'+
    usPhCompareTable([
      ['Founding statute','HIPAA (1996), amended by HITECH (2009)','Data Privacy Act of 2012 (RA 10173)'],
      ['Regulator','HHS Office for Civil Rights (OCR)','National Privacy Commission (NPC)'],
      ['Scope gate','Only "covered entities" and their Business Associates','Any personal information controller/processor handling PH-linked data, any industry — no healthcare-specific gate']
    ], {title:'A structurally different starting point — see Module 26 for the full comparison'})
},
{ id:2, level:1, title:'Protected Health Information (PHI)', domain:'foundational', practice:'classify', dataKey:'m2',
  authorityKeys:['privacy_rule','ph_dpa_statute'],
  blurb:'Classify 50 realistic data examples as PHI, not PHI, de-identified, or "depends" — and learn to defend the call.',
  learnHtml:
    '<p><strong>PHI</strong> is individually identifiable health information created or received by a covered entity or '+
    'Business Associate that relates to a person\'s past, present, or future physical or mental health, health care, or '+
    'payment for health care, AND either identifies the individual or could reasonably be used to do so. <strong>ePHI</strong> '+
    'is just PHI in electronic form — same rules, plus the Security Rule.</p>'+
    '<p>Two traps catch most beginners. First, PHI is defined by <em>who holds it and why</em>, not just by content — the '+
    'same blood-pressure number is PHI in a clinic\'s EHR and is <em>not</em> PHI sitting in a consumer fitness app with no '+
    'tie to a covered entity (though it may be regulated by the FTC or a state law instead). Second, "de-identified" is a '+
    'specific legal status, not a synonym for "seems anonymous" — data is only de-identified under the Privacy Rule if it '+
    'meets the Safe Harbor method (removal of all 18 listed identifiers, including dates more specific than year and '+
    'geographic subdivisions smaller than a state for populations under 20,000) or the Expert Determination method. A '+
    '"limited data set" that keeps dates and zip codes is <em>still PHI</em> and requires a data use agreement.</p>'+
    '<p>The 18 Safe Harbor identifiers include: names; geographic subdivisions smaller than a state; all elements of dates '+
    '(except year) directly related to an individual; phone/fax numbers; email addresses; SSNs; medical record numbers; '+
    'health plan beneficiary numbers; account numbers; certificate/license numbers; vehicle identifiers; device '+
    'identifiers; URLs; IP addresses; biometric identifiers; full-face photos and comparable images; and any other unique '+
    'identifying number, characteristic, or code.</p>'+
    usPhCompareTable([
      ['What it\'s called','Protected Health Information (PHI)','Sensitive Personal Information (Sec. 3(l)) — plus a separate "Privileged Information" category (Sec. 3(k))'],
      ['What triggers coverage','Held by a covered entity/Business Associate, specifically','Identifies an individual, held by ANY personal information controller/processor, any sector'],
      ['Scope of the category','Health, treatment, and payment information','Health PLUS race, ethnic origin, marital status, religious/political affiliation, genetic/sexual life, offense records, and government-issued IDs — broader than PHI'],
      ['De-identification','Removes PHI status entirely (Safe Harbor / Expert Determination)','Removes coverage once no individual is identified or reasonably identifiable — same underlying idea']
    ], {title:'PHI vs. Sensitive Personal Information — related concepts, different boundaries (Module 26)'})
},
{ id:3, level:1, title:'Uses and Disclosures', domain:'privacy_rule', practice:'scenario', dataKey:'m3',
  authorityKeys:['privacy_rule','min_necessary_guidance'],
  blurb:'Rapid-fire cases on treatment/payment/operations, authorization, minimum necessary, and incidental disclosure.',
  learnHtml:
    '<p>The Privacy Rule\'s default posture is permissive for three purposes — <strong>Treatment, Payment, and Health '+
    'Care Operations (TPO)</strong> — which a covered entity may use or disclose PHI for without patient authorization, '+
    'subject to minimum necessary (which does not even apply to treatment disclosures between providers). Everything '+
    'outside TPO and the specific list of "required" or "permitted without authorization" disclosures (e.g., as required '+
    'by law, public health, law enforcement under specific conditions) generally needs a valid <strong>authorization</strong>.</p>'+
    diagramBranch('A request for PHI arrives', ['TPO \u2192 Permitted, no authorization needed','Fits a specific permitted category \u2192 Permitted per that rule','Neither \u2192 Needs a valid authorization'], {boxW:170, caption:'The first sorting question for any disclosure request.'})+
    '<p><strong>Required disclosures</strong> are narrow: to the individual upon request (access), and to HHS for '+
    'compliance investigations. Nearly everything else framed as "required" in casual speech is actually only '+
    '<em>permitted</em> — an important distinction when a workforce member says "we have to release this."</p>'+
    '<p><strong>Incidental disclosures</strong> (a visitor overhears a name called in a waiting room; another patient sees '+
    'a whiteboard) are not violations if the covered entity had reasonable safeguards and applied minimum necessary in the '+
    'underlying practice that gave rise to them.</p>'+
    usPhCompareTable([
      ['Default posture','Permissive for TPO; authorization needed only outside that','Prohibited by default (Sec. 13); consent or a listed exception required for EVERY use, including treatment'],
      ['Treatment equivalent','Treatment disclosures are affirmatively permitted, exempt from minimum necessary','Sec. 13(e): medical treatment by a practitioner/institution is a listed exception to the default prohibition — same practical outcome, opposite legal starting point'],
      ['"Authorization" vs. "consent"','Needed only OUTSIDE the permitted categories','Needed by default, UNLESS a Sec. 13 exception applies — consent is the rule, not the exception']
    ], {title:'Permissive-by-default vs. prohibited-by-default — the single biggest structural difference (Module 26)'})
},
{ id:4, level:1, title:'Patient Rights', domain:'patient_rights', practice:'scenario', dataKey:'m4',
  authorityKeys:['privacy_rule','privacy_rule_coordination_nprm'],
  blurb:'Work incoming patient requests: access, amendment, restriction, confidential communication, and accounting.',
  learnHtml:
    '<p>The Privacy Rule gives individuals a defined set of rights, each with its own timeline and its own narrow set of '+
    'permitted denial grounds. A currently <strong>proposed</strong> (not yet final) rule would change several of these — '+
    'see the Authority button and Regulatory Watch for the coordinated-care NPRM — but everything below reflects what is '+
    'binding today:</p>'+
    '<ul>'+
    '<li><strong>Access</strong> — individuals can inspect/obtain copies of their own PHI in a designated record set, '+
    'generally within 30 days (extendable once by 30 days with notice); a small number of grounds allow denial, some '+
    'reviewable and some not, and fees are limited to a reasonable, cost-based amount.</li>'+
    '<li><strong>Amendment</strong> — individuals can request a correction; the covered entity can deny on specific '+
    'grounds (e.g., the record is accurate and complete) but must offer a process for the individual to submit a '+
    'statement of disagreement.</li>'+
    '<li><strong>Confidential communications</strong> — reasonable accommodation requests (e.g., "call my cell, not my '+
    'home") must generally be honored without requiring an explanation.</li>'+
    '<li><strong>Restriction requests</strong> — generally the covered entity may decline, <em>except</em> a specific '+
    'HITECH-added mandatory restriction: if the individual paid out-of-pocket in full for an item/service, they can '+
    'require that it not be disclosed to a health plan for payment/operations purposes.</li>'+
    '<li><strong>Accounting of disclosures</strong> — a list of certain non-TPO disclosures made in the prior six years, '+
    'with statutory carve-outs (e.g., disclosures for TPO are excluded from the accounting in the current rule as '+
    'written, though HITECH proposed a broader electronic-access accounting that HHS never finalized as final regulatory '+
    'text — verify current status before representing this as settled).</li>'+
    '</ul>'
},
{ id:5, level:1, title:'Workforce Privacy', domain:'privacy_rule', practice:'scenario', dataKey:'m5',
  authorityKeys:['privacy_rule','security_rule'],
  blurb:'Snooping, gossip, unlocked screens, texting, shared logins — decide compliant, noncompliant, or needs investigation.',
  learnHtml:
    '<p>Most real-world HIPAA problems are not exotic disclosure puzzles — they are ordinary workforce behavior: '+
    'looking up a coworker\'s or celebrity patient\'s chart out of curiosity ("snooping"), discussing a patient in an '+
    'elevator, leaving a screen unlocked, texting PHI on a personal device, or sharing a login for convenience. None of '+
    'these require a novel legal theory; they require applying minimum necessary, the workforce sanctions requirement '+
    '(45 C.F.R. § 164.530(e)), and basic Security Rule access-control safeguards consistently — and knowing when a '+
    'pattern crosses from a training moment into a reportable incident.</p>'
},
{ id:6, level:2, title:'Complex Disclosure Analysis', domain:'privacy_rule', practice:'scenario', dataKey:'m6',
  authorityKeys:['privacy_rule'],
  blurb:'Spouses, minors, personal representatives, attorneys, law enforcement, employers — identity, authority, and purpose.',
  learnHtml:
    '<p>Once a requestor is not the patient, every case runs through the same four-part check, in order: '+
    '(1) <strong>identity verification</strong> — is this person who they claim to be; (2) <strong>authority</strong> — '+
    'personal representative status, parental authority, a valid power of attorney, a court order, or a specific legal '+
    'exception (e.g., certain law-enforcement disclosures under 45 C.F.R. § 164.512(f)); (3) <strong>purpose</strong> — '+
    'does the stated purpose match a permitted category; and (4) <strong>minimum necessary</strong> — even when '+
    'disclosure is permitted, how much should actually go out. Minors, emancipated minors, and state law on parental '+
    'access to adolescent behavioral-health or reproductive-health records are where this gets genuinely hard, because '+
    'state law — not HIPAA — usually supplies the substantive rule on who counts as a "personal representative" for a '+
    'minor.</p>'
},
{ id:7, level:2, title:'Minimum Necessary Masterclass', domain:'privacy_rule', practice:'scenario', dataKey:'m7',
  authorityKeys:['min_necessary_guidance'],
  blurb:'Four workflow cases — billing, scheduling, an external vendor, and treatment — where the exceptions actually matter.',
  learnHtml:
    '<p>Minimum necessary (45 C.F.R. §§ 164.502(b), 164.514(d)) is not a phrase to memorize; it is a workflow-design '+
    'question: what does <em>this role</em>, doing <em>this task</em>, actually need to see? It has real exceptions worth '+

{ id:8, level:2, title:'Authorizations', domain:'privacy_rule', practice:'scenario', dataKey:'m8',
  authorityKeys:['privacy_rule'],
  blurb:'Find every defect in fictional authorization forms — core elements, revocation, psychotherapy notes, marketing, sale of PHI.',
  learnHtml:
    '<p>A valid authorization under 45 C.F.R. § 164.508 needs specific core elements (a meaningful description of the '+
    'information, who may disclose and to whom, purpose, an expiration date/event, signature and date) and required '+
    'statements (right to revoke in writing, whether treatment/payment/enrollment can be conditioned on signing — and for '+
    'most authorizations, it <strong>cannot</strong> be — and the potential for redisclosure once information leaves a '+
    'HIPAA-covered entity). <strong>Psychotherapy notes</strong>, <strong>marketing</strong> uses, and the '+
    '<strong>sale of PHI</strong> each require their own specific, more restrictive authorization language — a generic '+
    'authorization does not cover them.</p>'
},
{ id:9, level:2, title:'Business Associates', domain:'ba_oversight', practice:'scenario', dataKey:'m9',
  authorityKeys:['privacy_rule','hitech'],
  blurb:'Review fictional vendor contracts for missing or defective Business Associate Agreement terms.',
  learnHtml:
    '<p>A <strong>Business Associate</strong> is a person or entity (other than a member of the covered entity\'s own '+
    'workforce) that creates, receives, maintains, or transmits PHI to perform a function on the covered entity\'s '+
    'behalf — billing companies, cloud EHR hosts, transcription services, and (since 2013) their '+
    '<strong>subcontractors</strong>, who need their own downstream BAAs with equivalent terms. A required BAA needs, at '+
    'minimum: permitted uses/disclosures, a prohibition on further impermissible use, required safeguards (including '+
    'Security Rule compliance for ePHI), breach/incident reporting obligations back to the covered entity, subcontractor '+
    'flow-down, and return/destruction of PHI at termination. HITECH made Business Associates <em>directly</em> liable '+
    'under HIPAA — a missing or thin BAA does not remove Security Rule obligations, it just adds contract risk on top of '+
    'regulatory risk.</p>'+
    usPhCompareTable([
      ['The vendor-management document','Business Associate Agreement (BAA)','Outsourcing/data-sharing agreement with a Personal Information Processor (PIP)'],
      ['Who stays accountable to the regulator','The Business Associate has direct HIPAA liability of its own (since HITECH)','The Personal Information Controller (PIC) remains primarily accountable to the NPC, even when work is outsourced to a PIP'],
      ['Real-world overlap','—','Philippine BPO/health-information-management vendors serving U.S. clients are very often BOTH a HIPAA Business Associate (or subcontractor) AND an NPC-regulated PIP for the exact same engagement — both agreements are typically needed']
    ], {title:'This is exactly the situation many Philippine health-BPO compliance roles live in (Module 26)'})
},
{ id:10, level:2, title:'Patient Complaints', domain:'patient_rights', practice:'workflow', dataKey:'m10',
  authorityKeys:['privacy_rule','enforcement_rule'],
  blurb:'Run an intake through classification, fact-gathering, findings, response, and corrective action.',
  learnHtml:
    '<p>Every covered entity must have a complaint process (45 C.F.R. § 164.530(d)) and may not retaliate against anyone '+
    'who files one. A complaint that a Privacy Officer mishandles procedurally can turn into an OCR complaint even when '+
    'the underlying privacy issue was minor — so the workflow discipline (intake → classify → gather facts → compare to '+
    'policy → interview → document findings → respond → corrective action) matters as much as the substantive privacy '+
    'analysis.</p>'
},
{ id:11, level:3, title:'Privacy Incident Response', domain:'investigation', practice:'workflow', dataKey:'m11',
  authorityKeys:['breach_rule','security_rule'],
  blurb:'Detect, contain, preserve evidence, investigate, assess, document, escalate, notify, remediate, monitor.',
  learnHtml:
    '<p>Treat every notification the same way procedurally, regardless of how small it looks at first: '+
    '<strong>Detect → Contain → Preserve evidence → Classify → Investigate → Assess → Document → Escalate → Notify → '+
    'Remediate → Monitor.</strong> Skipping "preserve evidence" to rush to "fix it" is the single most common way an '+
    'organization loses the ability to do an accurate breach risk assessment later. Not every incident is a HIPAA '+
    'breach, and not every incident that isn\'t a breach is nothing — some are workforce sanctions issues, some are '+
    'Security Rule control gaps, and some genuinely need "insufficient information — investigate further" as the honest '+
    'answer at first pass.</p>'+
    diagramFlow(['Detect','Contain','Preserve Evidence','Classify','Investigate','Assess','Document','Escalate','Notify','Remediate','Monitor'], {perRow:6, boxW:118, boxH:64, caption:'The eleven-stage response pipeline you\'ll work through in Practice, for every case.'})
},
{ id:12, level:3, title:'Breach Notification', domain:'breach', practice:'scenario', dataKey:'m12',
  authorityKeys:['breach_rule','ph_npc_breach_circular'],
  blurb:'Distinguish impermissible disclosure from a reportable breach, and apply notification timing and content rules.',
  learnHtml:
    diagramFlow(['Impermissible use/disclosure','Exception applies?','Four-factor analysis','Notification determination'], {perRow:4, numbered:false, boxW:150, caption:'Every case runs through this sequence before you notify anyone.'})+
    '<p>Not every impermissible use or disclosure of PHI is a "breach" requiring notification — it is a breach '+
    '<em>unless</em> the covered entity demonstrates, through the four-factor risk assessment (Module 13), a low '+
    'probability that the PHI was compromised, or a specific regulatory exception applies (e.g., certain unintentional '+
    'workforce access made in good faith, or a limited-data-set exception no longer available after the 2013 changes). '+
    'If it is a breach: notify affected <strong>individuals</strong> without unreasonable delay and no later than 60 '+
    'days; notify <strong>HHS</strong> immediately if 500+ individuals are affected (with contemporaneous media notice '+
    'in the affected jurisdiction) or annually within 60 days of year-end for breaches under 500; and a '+
    '<strong>Business Associate</strong> that discovers a breach must notify the covered entity without unreasonable '+
    'delay, no later than 60 days, so the covered entity can meet its own clock.</p>'+
    usPhCompareTable([
      ['Notification deadline','No later than 60 days ("without unreasonable delay" is the real standard)','72 HOURS from knowledge or reasonable belief — a fraction of HIPAA\'s outer limit'],
      ['Who gets notified, and when','Individuals get notice; HHS gets immediate notice only at 500+ affected, otherwise annual','NPC and affected data subjects are notified CONCURRENTLY, every time the threshold is met — no "under 500, notify HHS later" equivalent'],
      ['What triggers the fast clock','A completed four-factor analysis decides whether notification is required at all','Mandatory, no-delay notification specifically when sensitive personal information is involved AND there is reasonable belief of unauthorized acquisition AND real risk of serious harm (NPC Circular 16-03) — analysis happens FAST, not instead of notifying'],
      ['Full report deadline','No separate "full report" concept — the notification itself is the requirement','A complete report to the NPC is due within 5 days of the initial 72-hour notification']
    ], {title:'If you remember one comparison from this whole course, make it this one (Module 26)'})
},
{ id:13, level:3, title:'Four-Factor Breach Risk Assessment', domain:'breach', practice:'fourfactor', dataKey:'m13',
  authorityKeys:['breach_rule'],
  blurb:'Write a defensible rationale across all four factors for genuinely ambiguous cases.',
  learnHtml:
    '<p>The four factors (45 C.F.R. § 164.402) are evaluated together, not independently, and the burden is on the '+
    'covered entity/BA to show low probability of compromise:</p>'+
    '<ol>'+
    '<li>The <strong>nature and extent</strong> of the PHI involved, including the types of identifiers and likelihood '+
    'of re-identification.</li>'+
    '<li>The <strong>unauthorized person</strong> who used the PHI or to whom the disclosure was made (e.g., another '+
    'covered entity bound by HIPAA lowers risk more than an unknown third party).</li>'+
    '<li>Whether the PHI was <strong>actually acquired or viewed</strong> versus only the opportunity to do so existed '+
    '(e.g., a lost, encrypted laptop where the key was never compromised).</li>'+
    '<li>The extent to which the risk has been <strong>mitigated</strong> (e.g., obtaining a signed confidentiality '+
    'statement or confirmation of destruction).</li>'+
    '</ol>'+
    diagramBranch('Four-Factor Risk Assessment', ['Nature & extent of PHI','Unauthorized recipient','Acquired or viewed?','Mitigation taken'], {outputLabel:'Low probability of compromise?', boxW:135, caption:'All four factors feed one determination — evaluated together, not independently.'})+
    '<p>"We don\'t have enough information yet to complete this assessment — here is what we still need to find out" is '+
    'a legitimate, professional conclusion at an early stage. It is not an acceptable <em>final</em> conclusion once '+
    'reasonable investigation is possible.</p>'
},
{ id:14, level:3, title:'HIPAA Security Rule', domain:'security_rule', practice:'scenario', dataKey:'m14',
  authorityKeys:['security_rule','security_nprm'],
  blurb:'Sort safeguards into administrative/physical/technical — then sort proposals from the current, binding rule.',
  learnHtml:
    '<p>The <strong>current, binding</strong> Security Rule (in force since 2005, amended 2013) organizes required and '+
    'addressable implementation specifications into three safeguard categories: <strong>administrative</strong> (risk '+
    'analysis and management, workforce security/sanctions, security awareness training, contingency planning, BAAs); '+
    '<strong>physical</strong> (facility access controls, workstation use/security, device and media controls); and '+
    '<strong>technical</strong> (access control, audit controls, integrity controls, authentication, transmission '+
    'security). "Addressable" does not mean optional — it means the entity must implement it, an equivalent alternative, '+
    'or document why neither is reasonable and appropriate.</p>'+
    '<p>Separately, a January 2025 <strong>proposed rule (NPRM)</strong> would eliminate the required/addressable '+
    'distinction and mandate specific controls (MFA, encryption at rest and in transit, network segmentation, a written '+
    'asset inventory, annual penetration testing, and more). As of this training\'s last verification, that proposal is '+
    '<strong>not law</strong> — HHS has pushed its own target for final action to July 2027 on the Unified Agenda. Teach '+
    'staff the current rule as binding and the proposal as "watch, plan for, do not yet cite as a requirement."</p>'
},
{ id:15, level:3, title:'Security Risk Assessment', domain:'risk_audit', practice:'register', dataKey:'m15',
  authorityKeys:['security_rule'],
  blurb:'Build a risk register for a fictional clinic from an org chart, network map, vendor list, and incident history.',
  learnHtml:
    '<p>The Security Rule\'s Risk Analysis standard (45 C.F.R. § 164.308(a)(1)(ii)(A)) is the single most-cited '+
    'deficiency in OCR investigations and settlements, year after year — not because it is conceptually hard, but '+
    'because it requires an accurate, current inventory of where ePHI actually lives, flows, and is exposed, followed by '+
    'a documented likelihood/impact rating and a mitigation plan with an owner and a due date. A risk analysis that lists '+
    'generic threats without mapping them to this specific organization\'s actual assets is exactly the kind of finding '+
    'OCR flags.</p>'
},
{ id:16, level:3, title:'HIPAA Compliance Audit', domain:'risk_audit', practice:'scenario', dataKey:'m16',
  authorityKeys:['privacy_rule','security_rule','enforcement_rule'],
  blurb:'Review an evidence packet for a fictional clinic and find the deficiencies — some obvious, some subtle.',
  learnHtml:
    '<p>An internal compliance audit walks the same evidence categories OCR asks for in an investigation: privacy '+
    'policies, training records, access-management logs, authorization forms on file, medical-record request handling, '+
    'BAAs, the Notice of Privacy Practices, complaint and incident logs, breach determinations, workforce sanctions '+
    'records, and the Security Rule risk analysis itself. Auditing is a documentation-comparison exercise: does what the '+
    'policy says happen actually match what the evidence shows happened?</p>'
},
{ id:17, level:4, title:'Mock OCR Investigation', domain:'investigation', practice:'report', dataKey:'m17',
  authorityKeys:['enforcement_rule','breach_rule'],
  blurb:'Investigate a full case file independently and produce an OCR-style investigation report.',
  learnHtml:
    '<p>An OCR-style investigation report follows a consistent structure: the <strong>allegation</strong> as stated; the '+
    '<strong>facts</strong> established from evidence; the <strong>applicable requirement</strong> (cite the actual rule '+
    'section); <strong>findings</strong> comparing facts to the requirement; a <strong>compliance determination</strong>; '+
    '<strong>mitigating factors</strong> considered; required <strong>corrective action</strong>; and a '+
    '<strong>monitoring</strong> plan. This is the same FIRAC-style discipline (Facts / Issue / Rule / Application / '+
    'Conclusion) used throughout this program, applied at investigation scale.</p>'
},
{ id:18, level:4, title:'Privacy Program Management', domain:'exec_judgment', practice:'scenario', dataKey:'m18',
  authorityKeys:['privacy_rule','security_rule'],
  blurb:'Governance, accountability, training cadence, monitoring, metrics, and continuous improvement, prioritized.',
  learnHtml:
    '<p>A privacy program is not a policy binder — it is a governance cycle: leadership accountability, a current risk '+
    'analysis, workforce training that is actually tracked, a working incident/complaint process, metrics that reach '+
    'executives, and a documented plan for continuous improvement. Privacy Officers spend a surprising amount of time on '+
    'prioritization judgment: with finite time and budget, which gap gets fixed first is itself a defensible, '+
    'documented decision.</p>'
},
{ id:19, level:4, title:'Privacy Governance & Stakeholder Conflict', domain:'exec_judgment', practice:'scenario', dataKey:'m19',
  authorityKeys:['privacy_rule','security_rule'],
  blurb:'IT wants broad access, Compliance wants minimum necessary, Clinical wants speed — you have to broker it.',
  learnHtml:
    '<p>A Privacy Officer\'s hardest calls are rarely "what does the rule say" — they are "whose legitimate but '+
    'competing interest wins in this specific operational moment," while staying inside what the rule actually permits. '+
    'General Counsel, the CISO, HIM, IT, clinical leadership, and vendors each have a real and reasonable position; the '+
    'job is to find the option that satisfies the legal floor without pretending the floor is the only consideration.</p>'
},
{ id:20, level:4, title:'Executive Briefing', domain:'exec_judgment', practice:'briefing', dataKey:'m20',
  authorityKeys:['breach_rule','enforcement_rule'],
  blurb:'Turn one incident into a frontline instruction, a management brief, and an executive risk memo.',
  learnHtml:
    '<p>The same incident needs three genuinely different documents, not three lengths of the same document: '+
    '<strong>frontline</strong> (simple, immediate operational instructions — what to do right now); '+
    '<strong>management</strong> (operational and compliance implications, what resources are needed); and '+
    '<strong>executive</strong> (exposure, risk, a clear recommendation, resource ask, and a deadline). Executives '+
    'want the bottom line and the decision they need to make, first.</p>'
},
{ id:21, level:4, title:'Multi-Law Conflict Scenarios', domain:'state_multilaw', practice:'scenario', dataKey:'m21',
  authorityKeys:['part2_rule','ftc_hbnr','info_blocking_rule','ph_dpa_statute'],
  blurb:'HIPAA meets Part 2, state law, information blocking, and FTC jurisdiction — which one actually governs?',
  learnHtml:
    '<p>Preemption is not a coin flip between "state law" and "federal law wins." HIPAA sets a <strong>federal floor</strong>: '+
    'a "more stringent" state law (one that gives individuals more privacy protection or more rights) is <em>not</em> '+
    'preempted and continues to apply alongside HIPAA. Part 2 has historically been the <em>more restrictive</em> '+
    'framework where it applies, and the 2024 Part 2 rule narrowed but did not eliminate that gap. When two valid '+
    'requirements genuinely conflict rather than one simply being stricter, that is exactly the moment to loop in legal '+
    'counsel rather than guess.</p>'+
    '<p>The same logic extends internationally. HIPAA and Republic Act 10173 are not competing for the same turf the '+
    'way a U.S. state law and HIPAA do — they are two entirely separate legal systems that can both apply, in full, to '+
    'the same processing activity at once (a Philippine health-BPO team handling U.S. patient data is a clean example, '+
    'and the subject of Module 26\'s deep dive). The multi-law discipline is identical either way: identify every '+
    'framework that could plausibly apply, work out which imposes the stricter requirement on each specific point '+
    '(RA 10173\'s 72-hour breach clock vs. HIPAA\'s 60 days, for instance), and default to whichever is stricter rather '+
    'than assuming compliance with one satisfies the other.</p>'
},
{ id:22, level:4, title:'State Privacy Law', domain:'state_multilaw', practice:'research', dataKey:'m22',
  authorityKeys:['state_privacy_landscape'],
  blurb:'HIPAA is not the whole picture. Practice researching a hypothetical state statute from first principles.',
  learnHtml:
    '<p>As of 2026, twenty U.S. states have comprehensive consumer privacy laws in effect (Indiana, Kentucky, and Rhode '+
    'Island joined January 1, 2026), almost all following the "Virginia model": attorney-general-only enforcement, no '+
    'private right of action (California is the notable exception, which does allow a private right of action for '+
    'certain data breaches), opt-in consent for sensitive data (which typically includes health data), and opt-out '+
    'rights for standard processing. Most of these laws <strong>exempt HIPAA-regulated PHI and HIPAA-covered '+
    'entities/BAs acting in that capacity</strong> — but they still reach consumer-health data collected by '+
    'organizations that are not covered entities, which is exactly the gap where wellness apps, period-tracking apps, '+
    'and direct-to-consumer health platforms live. A handful of states (Washington\'s My Health My Data Act was the '+
    'first prominent example) have gone further with dedicated <strong>consumer health data</strong> statutes that do '+
    'not carry a blanket HIPAA exemption. Rather than memorizing every state, learn the research method: does this law '+
    'exempt HIPAA-covered data/entities? What counts as covered "consumer health data"? What consent standard applies? '+
    'What are the breach obligations? Always verify against the state\'s own current statute — this module\'s exercise '+
    'uses a hypothetical statute for practice.</p>'
},
{ id:23, level:4, title:'AI & Healthcare Data Privacy', domain:'ai_governance', practice:'scenario', dataKey:'m23',
  authorityKeys:['privacy_rule','hitech'],
  blurb:'Ambient scribes, generative AI, chatbots, and shadow AI — spot the privacy, security, BA, and governance issues.',
  learnHtml:
    '<p>AI tools that touch PHI raise the same questions as any other vendor, just faster and less visibly: is this '+
    'vendor a <strong>Business Associate</strong>, and is there a <strong>BAA</strong> in place before any PHI goes in? '+
    'Does the tool <strong>retain or train on</strong> the organization\'s data, and did the BAA address that? Is a '+
    'public, consumer-grade AI tool being used by a workforce member without authorization ("shadow AI") — that is a '+
    'workforce/access-control problem, not a new legal category. A vendor\'s marketing claim of "HIPAA compliant" is not '+
    'itself a legal fact; a signed BAA and an actual security review are. De-identification claims for training data '+
    'need to be verified against the Safe Harbor or Expert Determination standard, not taken on faith.</p>'
},
{ id:24, level:4, title:'Information Blocking & Interoperability', domain:'ai_governance', practice:'scenario', dataKey:'m24',
  authorityKeys:['info_blocking_rule'],
  blurb:'Balance patients\' and providers\' legitimate access to health information against privacy protection.',
  learnHtml:
    '<p>The information blocking rule (45 C.F.R. Part 171, under the 21st Century Cures Act) is a <em>separate legal '+
    'regime from HIPAA</em>, enforced by ONC/ASTP and OIG, that presumes electronic health information should flow — '+
    'practices likely to interfere with access, exchange, or use of EHI are information blocking <em>unless</em> a '+
    'defined exception applies (e.g., the Privacy Exception, Security Exception, or Preventing Harm Exception). A '+
    'Privacy Officer who reflexively says "we can\'t share that" without checking whether a HIPAA permission or an '+
    'information-blocking exception actually applies can turn a privacy-protective instinct into a reportable '+
    'information-blocking practice.</p>'
},
{ id:25, level:4, title:'Expert Privacy Officer Command Simulation', domain:'exec_judgment', practice:'capstone', dataKey:'m25',
  authorityKeys:['enforcement_rule','breach_rule'],
  blurb:'A continuous, multi-stage simulation — new information arrives over time and the right strategy is not obvious.',
  learnHtml:
    '<p>This is the integration module: you run the privacy program of a fictional health system through a sequence of '+
    'linked events — a workforce snooping report, a vendor incident, a records request, a law-enforcement request, an '+
    'audit finding, and executive pressure to move faster than the facts support — and each decision changes what you '+
    'are dealing with next. There is rarely one clean right answer; you are scored on legal reasoning, prioritization, '+
    'investigation discipline, documentation, escalation judgment, communication, and whether you did the research '+
    'rather than guessed.</p>'
},
{ id:26, level:4, title:'Philippine Data Privacy Act (RA 10173) & Cross-Border Practice', domain:'ph_dpa', practice:'scenario', dataKey:'m26',
  authorityKeys:['ph_dpa_statute','ph_dpa_irr','ph_npc_breach_circular','ph_health_privacy_code'],
  blurb:'HIPAA is a U.S. law. If personal health data touches the Philippines — a patient, a hospital, or an outsourced BPO team — RA 10173 may govern instead, or alongside it.',
  learnHtml:
    '<p>The <strong>Data Privacy Act of 2012 (Republic Act No. 10173)</strong> is the Philippines\' comprehensive data '+
    'protection law, enforced by the <strong>National Privacy Commission (NPC)</strong> — the Philippine counterpart to '+
    'HHS/OCR. It is NOT a healthcare-specific law like HIPAA; it covers essentially any "personal information '+
    'controller" or "personal information processor" handling personal data connected to the Philippines, in any '+
    'sector. Health information is simply one category — a highly protected one — within its broader scope.</p>'+
    '<p>This matters immediately for two real, common situations: (1) a <strong>Philippine hospital, clinic, or health '+
    'plan</strong> is directly regulated by RA 10173 for all its patient data, full stop — there is no HIPAA-style '+
    '"covered entity" gate to pass through first; and (2) the Philippines is one of the world\'s largest hubs for '+
    '<strong>outsourced U.S. healthcare functions</strong> — medical transcription, health information management, '+
    'medical billing and coding, and health-plan customer service. A Manila-based team processing a U.S. hospital\'s '+
    'patient records is very often bound by <em>both</em> laws at once: HIPAA (through its Business Associate\'s own '+
    'obligations, which flow downstream to subcontractors) and RA 10173 (because the processing happens in, and the '+
    'workers are employed in, the Philippines).</p>'+
    usPhCompareTable([
      ['Governing law','HIPAA (1996) + HITECH (2009) + implementing regulations','Data Privacy Act of 2012 (RA 10173) + its 2016 IRR + NPC circulars/advisories'],
      ['Regulator','HHS Office for Civil Rights (OCR)','National Privacy Commission (NPC), an agency attached to the DICT'],
      ['Who is covered','Only "covered entities" and "Business Associates" — a healthcare-specific gate','Any "personal information controller" (PIC) or "personal information processor" (PIP) handling PH-linked personal data, in any industry'],
      ['Default posture for health data','Permissive for Treatment/Payment/Operations; authorization needed only outside that','Prohibited by default (Sec. 13); requires the data subject\'s specific consent OR a listed exception — e.g., medical treatment by a practitioner/institution (Sec. 13(e))'],
      ['Breach notification timeline','Individuals: no later than 60 days; HHS: immediate if 500+ affected, otherwise annual; a four-factor risk analysis decides if notice is even required','NPC AND affected data subjects notified within <strong>72 hours</strong> of knowledge/reasonable belief; full report due in 5 days (NPC Circular 16-03) — no 60-day cushion'],
      ['Privacy/compliance role','"Privacy Officer" — required by function, not by a specific registered title','"Data Protection Officer" (DPO) — a specific legally required title that must be registered with the NPC within 20 working days of appointment (NPC Circular 2022-04)'],
      ['Vendor management','Business Associate Agreement (BAA), with direct HIPAA liability for the BA','Data sharing/outsourcing agreements with a Personal Information Processor (PIP); the PIC remains primarily accountable to the NPC even when processing is outsourced'],
      ['Penalties','Primarily civil monetary penalties in tiers; criminal penalties are rare and DOJ-prosecuted','Criminal penalties (imprisonment plus fines) are a standard tool for unauthorized processing/disclosure, in addition to NPC administrative fines — verify current figures at the Official Gazette, since amendment bills proposing higher penalties remain pending in Congress'],
      ['Reach beyond national borders','Generally tied to U.S. covered-entity/BA status','Explicitly extraterritorial (Sec. 6) — reaches processing of Philippine citizens\'/residents\' data even by entities based entirely abroad']
    ], {title:'HIPAA vs. RA 10173 — the structural differences that matter operationally'})+
    '<p>Two provisions of RA 10173 deserve special attention for a healthcare-adjacent career:</p>'+
    '<ul><li><strong>Section 3(l) "Sensitive Personal Information"</strong> explicitly includes health, education, '+
    'genetic, and sexual-life information — broader than HIPAA\'s PHI, since it applies regardless of who holds it, '+
    'not just covered entities/BAs.</li>'+
    '<li><strong>Section 3(k) "Privileged Information"</strong> is a separate category covering anything privileged '+
    'under the Rules of Court — the doctor-patient privilege is the textbook example, and it is analyzed independently '+
    'from "sensitive personal information," sometimes with even stricter treatment.</li></ul>'+
    '<p>Career-path note: many Philippine professionals doing this work sit inside <strong>BPO and health information '+
    'management companies</strong> serving U.S. hospitals and health plans — a role that genuinely requires fluency in '+
    'both frameworks at once, since the same document can be simultaneously "PHI" under a client\'s HIPAA obligations '+
    'and "sensitive personal information" under the DPO\'s own RA 10173 accountability.</p>'
}
];

 {id:'d1', domain:'foundational', prompt:'Which of these is NOT one of the four main HIPAA regulations?',

  correct:'c', explanation:'HIPAA has a Privacy Rule, Security Rule, Breach Notification Rule, and Enforcement Rule. "Portability Rule" is not one of them — HIPAA\'s "portability" purpose refers to insurance coverage continuity, not a regulation name.'},

  correct:'b', explanation:'Health plans, health care clearinghouses, and providers who transmit health information electronically in connection with a covered transaction are the three types of covered entities.'},
 {id:'d3', domain:'ba_oversight', prompt:'A cloud vendor that hosts a clinic\'s EHR database, with access to PHI, is best described as a:',
  options:[{id:'a',text:'Covered entity'},{id:'b',text:'Business Associate'},{id:'c',text:'Data subject'},{id:'d',text:'Third-party beneficiary, not regulated by HIPAA'}],

 {id:'d4', domain:'privacy_rule', prompt:'A physician emails a specialist to coordinate a patient\'s treatment. Under the Privacy Rule, this disclosure generally:',

 {id:'d5', domain:'foundational', prompt:'PHI stands for:',
