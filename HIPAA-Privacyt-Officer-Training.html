// ---------------------------------------------------------------------------------------
// DIAGRAM HELPERS — original, hand-built SVG flowcharts (no external images/copyright risk).
// Two reusable shapes: diagramFlow (linear pipeline, wraps into rows) and diagramBranch
// (one root box branching into several children, optionally converging into an output box).
// Both scale to a fixed pixel width and scroll horizontally on narrow screens rather than
// shrinking text to illegibility.
// ---------------------------------------------------------------------------------------
var _diagramCounter = 0;
function wrapLabel(text, maxChars){
  maxChars = maxChars || 16;
  var words = String(text).split(' ');
  var lines = []; var cur = '';
  words.forEach(function(w){
    if((cur+' '+w).trim().length > maxChars && cur){ lines.push(cur); cur = w; }
    else { cur = (cur ? cur+' ' : '') + w; }
  });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}
function svgBoxText(cx, cy, label, opts){
  opts = opts || {};
  var lines = wrapLabel(label, opts.maxChars||16);
  var lh = opts.lineHeight || 14;
  var startY = cy - ((lines.length-1)*lh)/2;
  var out = '';
  lines.forEach(function(line,i){
    out += '<text x="'+cx+'" y="'+(startY+i*lh)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(opts.fontSize||12)+'" font-family="var(--sans)" font-weight="'+(opts.fontWeight||600)+'" fill="'+(opts.textColor||'var(--ink)')+'">'+escapeHtml(line)+'</text>';
  });
  return out;
}
function diagramWrap(svgInner, totalW, totalH, caption){
  return '<figure class="diagram-wrap"><div style="overflow-x:auto"><svg width="'+totalW+'" height="'+totalH+'" viewBox="0 0 '+totalW+' '+totalH+'" xmlns="http://www.w3.org/2000/svg">'+svgInner+'</svg></div>'+
    (caption?'<figcaption class="small muted" style="margin-top:6px">'+escapeHtml(caption)+'</figcaption>':'')+'</figure>';
}
function diagramFlow(steps, opts){
  opts = opts || {};
  _diagramCounter++;
  var mid = 'df'+_diagramCounter;
  var boxW = opts.boxW||140, boxH=opts.boxH||58, gapX=opts.gapX||30, gapY=opts.gapY||44;
  var perRow = opts.perRow || Math.min(steps.length,6);
  var rows = Math.ceil(steps.length/perRow);
  var totalW = perRow*boxW + (perRow-1)*gapX + 20;
  var totalH = rows*boxH + (rows-1)*gapY + 20;
  var svg = '<defs><marker id="'+mid+'" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--ink-soft)"/></marker></defs>';
  var pos = [];
  steps.forEach(function(step,i){
    var row=Math.floor(i/perRow), col=i%perRow;
    var x=10+col*(boxW+gapX), y=10+row*(boxH+gapY);
    pos.push({x:x,y:y});
    svg += '<rect x="'+x+'" y="'+y+'" width="'+boxW+'" height="'+boxH+'" rx="8" fill="var(--card)" stroke="var(--ink-soft)" stroke-width="1.4"/>';
    svg += svgBoxText(x+boxW/2, y+boxH/2, (opts.numbered===false?step:(i+1)+'. '+step), {maxChars:15});
  });
  steps.forEach(function(step,i){
    var row=Math.floor(i/perRow), col=i%perRow;
    if(col<perRow-1 && i<steps.length-1 && Math.floor((i+1)/perRow)===row){
      var p=pos[i];
      svg += '<line x1="'+(p.x+boxW)+'" y1="'+(p.y+boxH/2)+'" x2="'+(p.x+boxW+gapX-2)+'" y2="'+(p.y+boxH/2)+'" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#'+mid+')"/>';
    }
  });
  for(var r=0;r<rows-1;r++){
    var lastIdx = Math.min((r+1)*perRow, steps.length)-1;
    var firstNext = (r+1)*perRow;
    if(firstNext>=steps.length) break;
    var pFrom=pos[lastIdx], pTo=pos[firstNext];
    var xMid = pFrom.x+boxW+14;
    svg += '<path d="M'+(pFrom.x+boxW)+','+(pFrom.y+boxH/2)+' L'+xMid+','+(pFrom.y+boxH/2)+' L'+xMid+','+(pTo.y+boxH/2)+' L'+(pTo.x-2)+','+(pTo.y+boxH/2)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.6" marker-end="url(#'+mid+')"/>';
  }
  return diagramWrap(svg, totalW, totalH, opts.caption);
}
function diagramBranch(rootLabel, children, opts){
  opts = opts || {};
  _diagramCounter++;
  var mid='db'+_diagramCounter;
  var boxW=opts.boxW||150, boxH=opts.boxH||52, gapX=opts.gapX||18;
  var n=children.length;
  var totalW = n*boxW+(n-1)*gapX+20;
  var rootY=10, childY=rootY+boxH+50;
  var outputY = opts.outputLabel ? childY+boxH+50 : null;
  var totalH = (outputY? outputY+boxH : childY+boxH)+10;
  var rootX = totalW/2-boxW/2;
  var svg = '<defs><marker id="'+mid+'" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--ink-soft)"/></marker></defs>';
  svg += '<rect x="'+rootX+'" y="'+rootY+'" width="'+boxW+'" height="'+boxH+'" rx="8" fill="var(--brass-bg)" stroke="var(--brass-line)" stroke-width="1.4"/>';
  svg += svgBoxText(rootX+boxW/2, rootY+boxH/2, rootLabel, {maxChars:18, textColor:'var(--brass)'});
  var rootCx=rootX+boxW/2, rootBottom=rootY+boxH;
  var childPos=[];
  children.forEach(function(c,i){
    var x=10+i*(boxW+gapX);
    childPos.push({cx:x+boxW/2});
    svg += '<rect x="'+x+'" y="'+childY+'" width="'+boxW+'" height="'+boxH+'" rx="8" fill="var(--card)" stroke="var(--ink-soft)" stroke-width="1.4"/>';
    svg += svgBoxText(x+boxW/2, childY+boxH/2, c, {maxChars:18});
    var midY=rootBottom+25;
    svg += '<path d="M'+rootCx+','+rootBottom+' L'+rootCx+','+midY+' L'+(x+boxW/2)+','+midY+' L'+(x+boxW/2)+','+(childY-2)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.4" marker-end="url(#'+mid+')"/>';
  });
  if(opts.outputLabel){
    var outX=totalW/2-boxW/2;
    svg += '<rect x="'+outX+'" y="'+outputY+'" width="'+boxW+'" height="'+boxH+'" rx="8" fill="var(--s-guidance-bg)" stroke="var(--s-guidance-line)" stroke-width="1.4"/>';
    svg += svgBoxText(outX+boxW/2, outputY+boxH/2, opts.outputLabel, {maxChars:18, textColor:'var(--s-guidance)'});
    var midY2=childY+boxH+25;
    children.forEach(function(c,i){
      var cx=childPos[i].cx;
      svg += '<path d="M'+cx+','+(childY+boxH)+' L'+cx+','+midY2+' L'+(outX+boxW/2)+','+midY2+' L'+(outX+boxW/2)+','+(outputY-2)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" marker-end="url(#'+mid+')" opacity="0.85"/>';
    });
  }
  return diagramWrap(svg, totalW, totalH, opts.caption);
}

    '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--line-soft)" stroke-width="7"/>'+
    '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" '+
    'stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 36 36)"/>'+
    '<text x="36" y="41" text-anchor="middle" class="ring-num">'+pctVal+'</text></svg>'+
    '<div class="ring-label">'+escapeHtml(label)+'</div></div>';
}

    h += '<div class="callout" style="margin-bottom:20px">Haven\'t taken the Level 0 diagnostic yet? '+
         '<button class="btn-ghost" data-action="nav" data-view="diagnostic">Start it here →</button></div>';
  }

  for(var lvl=1; lvl<=4; lvl++){
    var mods = MODULES.filter(function(m){return m.level===lvl;});

    h += '<div class="divider-label">Level '+lvl+' — '+lvlNames[lvl]+'</div>';
    h += '<div class="grid grid-2">';

      h += '<div class="card mod-card">';

// ---------------------------------------------------------------------------------------
// MODULE DETAIL — Learn / Practice / (Assess) tabs
// ---------------------------------------------------------------------------------------
function renderModuleDetail(moduleId){
  var mod = moduleById(Number(moduleId));
  if(!mod) return '<div class="content"><p>Module not found.</p></div>';
  state.lastModule = mod.id; scheduleSave();
  var tab = state.params.tab || state.moduleTab[mod.id] || 'learn';
  state.moduleTab[mod.id] = tab;
  var hasAssess = moduleHasAssessTab(mod);

  var h = '<div class="content">';
  h += '<div class="eyebrow">Level '+mod.level+' · Module '+mod.id+' · '+escapeHtml(DOMAINS[mod.domain])+'</div>';
  h += '<h1>'+escapeHtml(mod.title)+'</h1>';
  h += '<p class="lede">'+escapeHtml(mod.blurb)+'</p>';
  if(mod.authorityKeys && mod.authorityKeys.length){
    h += '<div class="pill-row" style="margin-bottom:18px">'+mod.authorityKeys.map(function(k){return authorityButton(k);}).join(' ')+'</div>';
  }

  h += '<div class="tabs">';
  h += '<button class="tab'+(tab==='learn'?' active':'')+'" data-action="module-tab" data-module="'+mod.id+'" data-tab="learn">Learn</button>';
  h += '<button class="tab'+(tab==='practice'?' active':'')+'" data-action="module-tab" data-module="'+mod.id+'" data-tab="practice">'+(hasAssess?'Practice':'Practice &amp; Assess')+'</button>';
  if(hasAssess) h += '<button class="tab'+(tab==='assess'?' active':'')+'" data-action="module-tab" data-module="'+mod.id+'" data-tab="assess">Assess</button>';
  h += '</div>';

  if(tab==='learn') h += renderModuleLearn(mod);
  else if(tab==='assess') h += renderModulePractice(mod, true);
  else h += renderModulePractice(mod, false);

  h += '</div>';
  return h;
}

function renderModuleLearn(mod){
  var h = '<div class="prose">'+mod.learnHtml+'</div>';
  h += '<div class="btn-row" style="margin-top:20px">';
  h += '<button class="btn" data-action="module-tab" data-module="'+mod.id+'" data-tab="practice">Continue to Practice →</button>';
  h += '</div>';
  return h;
}

// Dispatches to the correct interactive engine for a module's Practice/Assess tab.
function renderModulePractice(mod, assessMode){
  switch(mod.practice){
    case 'classify': return renderClassifyEngine(mod, assessMode);
    case 'scenario': return renderScenarioEngine(mod, assessMode);
    case 'map': return renderMapEngine(mod);
    case 'workflow': return renderWorkflowEngine(mod);
    case 'fourfactor': return renderFourFactorEngine(mod);
    case 'register': return renderRegisterEngine(mod);
    case 'report': return renderReportEngine(mod);
    case 'briefing': return renderBriefingEngine(mod);
    case 'research': return renderStateLawEngine(mod);
    case 'capstone': return renderCapstoneEngine(mod);
    default: return '<p class="muted">This activity is still being built.</p>';
  }
}

// ---------------------------------------------------------------------------------------
// SHARED: chip navigator used by every item-bank-style engine (classify, scenario, map quiz)
// ---------------------------------------------------------------------------------------
function chipNav(ids, currentIndex, navAction, extraData){
  var h = '<div class="step-track">';
  ids.forEach(function(id,i){

    var cls = 'step-chip'+(i===currentIndex?' current':'')+(a?(a.correct?' done':' wrong'):'');
    h += '<button class="'+cls+'" data-action="'+navAction+'" data-index="'+i+'" '+(extraData||'')+'>'+(i+1)+'</button>';
  });
  h += '</div>';
  return h;
}
function prevNextRow(currentIndex, total, navAction, extraData){
  var h = '<div class="btn-row" style="margin-top:16px">';
  h += '<button class="btn-outline btn btn-sm" data-action="'+navAction+'" data-index="'+Math.max(0,currentIndex-1)+'" '+(extraData||'')+(currentIndex===0?' disabled':'')+'>← Previous</button>';
  h += '<button class="btn-outline btn btn-sm" data-action="'+navAction+'" data-index="'+Math.min(total-1,currentIndex+1)+'" '+(extraData||'')+(currentIndex===total-1?' disabled':'')+'>Next →</button>';
  h += '</div>';
  return h;
}

// SCENARIO ENGINE — the workhorse. Handles both single-select and multi-select items, and
// both Practice (browse freely) and Assess (scored pass) modes for the same underlying bank.
// ---------------------------------------------------------------------------------------
function renderScenarioEngine(mod, assessMode){
  var bank = SCENARIO_BANKS[mod.dataKey]||[];
  var ids = assessMode ? getAssessItemIds(mod) : bank.map(function(i){return i.id;});
  var items = ids.map(function(id){ return bank.filter(function(b){return b.id===id;})[0]; });
  var uiKey = 'scenario-'+mod.id+(assessMode?'-assess':'-practice');

  if(assessMode && state.assessDone[mod.id]) return renderAssessSummary(mod, ids);

  var idx = state.ui[uiKey]||0; if(idx>=items.length) idx=Math.max(0,items.length-1);
  var item = items[idx];
  var attemptedCount = ids.filter(function(id){return state.answers[id];}).length;

  var h='';
  if(assessMode){
    h += '<div class="callout" style="margin-bottom:16px">Assessment mode — '+ids.length+' item'+(ids.length>1?'s':'')+', scored. '+attemptedCount+' of '+ids.length+' answered.</div>';
  }
  h += chipNav(ids, idx, 'scenario-nav', 'data-module="'+mod.id+'" data-uikey="'+uiKey+'" data-assess="'+(assessMode?1:0)+'"');
  h += '<div class="card">';
  if(item.situation){
    h += item.doc ? '<div class="doc-frame" style="margin-bottom:14px">'+nl2br(item.situation)+'</div>'
                   : '<p class="muted" style="margin-bottom:10px">'+escapeHtml(item.situation)+'</p>';
  }
  h += '<p style="font-weight:600;margin-bottom:14px">'+escapeHtml(item.ask)+'</p>';

  var a = state.answers[item.id];
  if(item.multi){
    var pending = state.ui['multi-'+item.id] || (a ? a.selected : []);
    item.options.forEach(function(opt){
      var selected = pending.indexOf(opt.id)>-1;
      var cls='option-btn';
      if(a){ if(item.multiCorrect.indexOf(opt.id)>-1) cls+=' correct'; else if(selected) cls+=' incorrect'; }
      else if(selected) cls+=' selected';
      h += '<button class="'+cls+'" '+(a?'disabled':'')+' data-action="scenario-toggle" data-item="'+item.id+'" data-option="'+opt.id+'">'+
           (selected&&!a?'☑ ':'☐ ')+escapeHtml(opt.text)+'</button>';
    });
    if(!a){
      h += '<div class="btn-row" style="margin-top:10px"><button class="btn btn-sm" data-action="scenario-submit-multi" data-item="'+item.id+'" data-module="'+mod.id+'">Submit answer</button></div>';
    }
  } else {
    item.options.forEach(function(opt){
      var cls='option-btn';
      if(a){ if(opt.id===item.correct) cls+=' correct'; else if(opt.id===a.selected) cls+=' incorrect'; }
      h += '<button class="'+cls+'" '+(a?'disabled':'')+' data-action="scenario-select" data-item="'+item.id+'" data-option="'+opt.id+'" data-module="'+mod.id+'">'+escapeHtml(opt.text)+'</button>';
    });
  }
  if(a){
    h += '<div class="feedback-box '+(a.correct?'feedback-correct':'feedback-incorrect')+'">'+
         '<strong>'+(a.correct?'Correct. ':'Not quite. ')+'</strong>'+escapeHtml(item.rationale)+
         (item.authorityKey? ' '+authorityButton(item.authorityKey) : '')+'</div>';
  }
  h += '</div>';
  h += prevNextRow(idx, items.length, 'scenario-nav', 'data-module="'+mod.id+'" data-uikey="'+uiKey+'" data-assess="'+(assessMode?1:0)+'"');
  if(assessMode){
    h += '<div class="btn-row" style="margin-top:18px"><button class="btn btn-brass" data-action="finish-assess" data-module="'+mod.id+'">Finish &amp; Score ('+attemptedCount+'/'+ids.length+' answered)</button></div>';
  }
  return h;
}

function findSourceItem(source, itemId){
  if(source==='phi') return PHI_ITEMS.filter(function(i){return i.id===itemId;})[0];
  if(source.indexOf('scn:')===0){ var dk=source.slice(4); return (SCENARIO_BANKS[dk]||[]).filter(function(i){return i.id===itemId;})[0]; }
  return null;
}
function chipClass(id){
  var a = state.answers[id];
  if(!a) return '';
  return a.correct ? ' done' : ' done';
}
function renderItemChips(navKey, ids, currentIdx){
  var h = '<div class="step-track">';
  ids.forEach(function(id,i){
    var a = state.answers[id];
    var cls = 'step-chip';
    if(i===currentIdx) cls += ' current';
    else if(a) cls += (a.correct?' done':'');
    var mark = a ? (a.correct?' ✓':' ·') : '';
    h += '<button class="'+cls+'" data-action="item-nav" data-navkey="'+navKey+'" data-index="'+i+'" style="'+(a && !a.correct && i!==currentIdx ? 'background:var(--s-vacated-bg);color:var(--s-vacated)':'')+'">'+(i+1)+mark+'</button>';
  });

  return h;
}
function assessSummaryBlock(mod, ids, onRetryAction){
  var attempted=0, correct=0;
  ids.forEach(function(id){ var a=state.answers[id]; if(a){attempted++; if(a.correct) correct++;} });
  var pctVal = attempted? pct(correct,attempted): 0;
  var h = '<div class="card" style="text-align:center;padding:36px 20px">';
  h += '<div class="eyebrow">Assessment complete</div>';
  h += '<div style="font-family:var(--serif);font-size:40px;font-weight:600;color:var(--ink);margin:8px 0">'+pctVal+'%</div>';
  h += '<p class="muted">'+correct+' of '+attempted+' correct ('+ids.length+' question set)</p>';
  h += '<div class="btn-row" style="justify-content:center;margin-top:14px">';

  h += '<button class="btn" data-action="module-tab" data-module="'+mod.id+'" data-tab="learn">Back to Learn</button>';
  h += '</div></div>';
  return h;
}

// ---------------------------------------------------------------------------------------
// SCENARIO ENGINE — the general-purpose workhorse (single or multi-select)
// ---------------------------------------------------------------------------------------
function renderScenarioEngine(mod, assessMode){
  var navKey = 'scenario-'+mod.id+(assessMode?'-assess':'-practice');
  var bank = SCENARIO_BANKS[mod.dataKey] || [];
  var ids = assessMode ? getAssessItemIds(mod) : bank.map(function(i){return i.id;});

  if(assessMode && state.ui[navKey+'-done']){
    return assessSummaryBlock(mod, ids);
  }

  var idx = state.ui[navKey+'-idx'] || 0;
  if(idx>=ids.length) idx = ids.length-1;
  var itemId = ids[idx];
  var item = bank.filter(function(i){return i.id===itemId;})[0];
  var answered = state.answers[item.id];

  var h='';
  if(assessMode) h += '<p class="callout" style="margin-bottom:18px">Assessment mode — '+ids.length+' items, one pass. Your score is recorded when you finish.</p>';
  h += renderItemChips(navKey, ids, idx);
  h += '<div class="card"><div class="eyebrow">Item '+(idx+1)+' of '+ids.length+'</div>';
  if(item.situation){
    if(item.doc) h += '<div class="doc-frame" style="margin-bottom:14px">'+nl2br(item.situation)+'</div>';
    else h += '<p style="margin-bottom:8px">'+escapeHtml(item.situation)+'</p>';
  }
  h += '<p style="font-weight:600;margin-bottom:14px">'+escapeHtml(item.ask)+'</p>';

  if(item.multi){
    var pending = state.ui['pending-'+item.id] || [];
    h += '<div>';
    item.options.forEach(function(opt){
      var picked = answered ? (answered.selected||[]).indexOf(opt.id)>-1 : pending.indexOf(opt.id)>-1;
      var cls='option-btn';
      if(answered){
        var wasCorrect = item.multiCorrect.indexOf(opt.id)>-1;
        if(wasCorrect && picked) cls+=' correct';
        else if(wasCorrect && !picked) cls+=' correct'; // show all true positives after grading
        else if(!wasCorrect && picked) cls+=' incorrect';
        else cls+='';
      } else if(picked) cls+=' selected';
      var mark = answered ? (item.multiCorrect.indexOf(opt.id)>-1 ? ' ✓' : (picked?' ✕':'')) : (picked?' ✓':'');
      h += '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="toggle-multi" data-source="scn:'+mod.dataKey+'" data-itemid="'+item.id+'" data-option="'+opt.id+'">'+escapeHtml(opt.text)+mark+'</button>';
    });
    h += '</div>';
    if(!answered){
      h += '<div class="btn-row" style="margin-top:10px"><button class="btn" data-action="submit-multi" data-source="scn:'+mod.dataKey+'" data-itemid="'+item.id+'" data-domain="'+mod.domain+'">Submit selections</button></div>';
    } else {
      h += '<div class="feedback-box '+(answered.correct?'feedback-correct':'feedback-incorrect')+'"><strong>'+(answered.correct?'Exact match.':'Not an exact match.')+'</strong> '+escapeHtml(item.rationale)+'</div>';
    }
  } else {
    h += '<div>';
    item.options.forEach(function(opt){
      var cls='option-btn';
      if(answered){
        if(opt.id===item.correct) cls+=' correct';
        else if(answered.selected===opt.id) cls+=' incorrect';
      }
      h += '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="select-single" data-source="scn:'+mod.dataKey+'" data-itemid="'+item.id+'" data-option="'+opt.id+'" data-domain="'+mod.domain+'" data-navkey="'+navKey+'">'+escapeHtml(opt.text)+'</button>';
    });
    h += '</div>';
    if(answered){
      h += '<div class="feedback-box '+(answered.correct?'feedback-correct':'feedback-incorrect')+'"><strong>'+(answered.correct?'Correct.':'Not quite.')+'</strong> '+escapeHtml(item.rationale)+'</div>';
    }
  }
  if(item.authorityKey) h += '<div style="margin-top:12px">'+authorityButton(item.authorityKey)+'</div>';
  h += '</div>';

  h += '<div class="btn-row" style="margin-top:14px">';
  if(idx>0) h += '<button class="btn-outline btn" data-action="item-nav" data-navkey="'+navKey+'" data-index="'+(idx-1)+'">← Previous</button>';
  if(idx<ids.length-1) h += '<button class="btn btn-outline" data-action="item-nav" data-navkey="'+navKey+'" data-index="'+(idx+1)+'">Next →</button>';
  if(assessMode){
    var attemptedCount = ids.filter(function(id){return state.answers[id];}).length;
    h += '<button class="btn btn-brass" data-action="finish-assess" data-module="'+mod.id+'" data-navkey="'+navKey+'" data-ids="'+ids.join(',')+'">Finish &amp; see score ('+attemptedCount+'/'+ids.length+' answered)</button>';
  }
  h += '</div>';
  return h;
}

var _module1QuizCache = null;
function getModule1Quiz(){
  if(_module1QuizCache) return _module1QuizCache;
  var pairs = MODULE1_MAP.matching;
  _module1QuizCache = pairs.map(function(p,i){
    var distractors = shuffle(pairs.filter(function(_,j){return j!==i;})).slice(0,3).map(function(d){return d.def;});
    var opts = shuffle([p.def].concat(distractors)).map(function(def,k){return {id:String.fromCharCode(97+k), text:def};});
    var correctId = opts.filter(function(o){return o.text===p.def;})[0].id;
    return { id:'map-'+i, term:p.term, options:opts, correct:correctId };
  });
  return _module1QuizCache;
}
function renderMapEngine(mod){
  var h = '<div class="eyebrow" style="margin-top:4px">Explore the map</div>';
  h += '<div class="grid grid-2">';
  MODULE1_MAP.components.forEach(function(c){
    var open = state.ui['map-open-'+c.id];
    h += '<div class="card card-tight" data-action="map-toggle" data-cid="'+c.id+'" style="cursor:pointer">';
    h += '<div class="mod-meta">'+escapeHtml(c.group)+'</div><div class="mod-title" style="font-size:15px">'+escapeHtml(c.label)+'</div>';
    if(open){ h += '<p class="small" style="margin-top:8px">'+escapeHtml(c.blurb)+'</p><p class="small muted">'+escapeHtml(c.relations)+'</p>'; }
    else { h += '<p class="small muted">Click to expand →</p>'; }

function renderWorkflowEngine(mod){
  var data = WORKFLOW_CASES[mod.dataKey];
  var cases = data.cases;
  if(cases.length===1) return renderWorkflowCase(mod, cases[0]);

  var activeCaseId = state.ui['wf-active-'+mod.id];
  if(activeCaseId){
    var c = cases.filter(function(cc){return cc.id===activeCaseId;})[0];
    var h = '<button class="btn-ghost" data-action="wf-back" data-module="'+mod.id+'">← All cases</button>';
    h += renderWorkflowCase(mod, c);
    return h;
  }
  var h = '<div class="grid grid-3">';
  cases.forEach(function(c){
    var prog = state.workflowProgress[c.id];
    var done = prog!==undefined && prog>=c.stages.length;
    h += '<div class="card card-tight"><div class="mod-title" style="font-size:14.5px">'+escapeHtml(c.title)+'</div>'+
         '<p class="small muted">'+escapeHtml(c.intake.slice(0,110))+'…</p>'+
         '<button class="btn btn-sm" data-action="wf-open-case" data-module="'+mod.id+'" data-case="'+c.id+'">'+(prog===undefined?'Begin case':(done?'Review case ✓':'Resume case'))+'</button></div>';
  });
  h += '</div>';
  return h;
}
function renderWorkflowCase(mod, c){
  var stageIdx = state.workflowProgress[c.id] || 0;
  var h = '<div class="card" style="margin-bottom:16px"><div class="eyebrow">Case intake</div><p>'+escapeHtml(c.intake)+'</p></div>';
  h += '<div class="step-track">';
  c.stages.forEach(function(s,i){
    var cls='step-chip'+(i===stageIdx?' current':(i<stageIdx?' done':''));
    h += '<span class="'+cls+'">'+(i+1)+'. '+escapeHtml(s.label)+'</span>';
  });
  h += '</div>';
  if(stageIdx>=c.stages.length){
    h += '<div class="card" style="text-align:center;padding:28px"><div class="eyebrow">Case closed</div><p>You\'ve worked this case through the full response pipeline.</p>'+
         '<button class="btn-outline btn" data-action="wf-reset-case" data-case="'+c.id+'">Restart this case</button></div>';
    return h;
  }
  var stage = c.stages[stageIdx];
  h += '<div class="card"><div class="eyebrow">'+escapeHtml(stage.label)+'</div>';
  if(stage.decision){
    var answered = state.answers[c.id+'-'+stage.key];
    h += '<p style="font-weight:600;margin-bottom:14px">'+escapeHtml(stage.decision.prompt)+'</p><div>';
    stage.decision.options.forEach(function(opt){
      var cls='option-btn';
      if(answered){ if(opt.id===stage.decision.correct) cls+=' correct'; else if(answered.selected===opt.id) cls+=' incorrect'; }
      h += '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="wf-decide" data-case="'+c.id+'" data-stage="'+stage.key+'" data-option="'+opt.id+'" data-domain="'+mod.domain+'">'+escapeHtml(opt.text)+'</button>';
    });
    h += '</div>';
    if(answered){
      h += '<div class="feedback-box '+(answered.correct?'feedback-correct':'feedback-incorrect')+'">'+escapeHtml(stage.decision.feedback)+'</div>';
      h += '<div class="btn-row" style="margin-top:10px"><button class="btn" data-action="wf-advance" data-case="'+c.id+'">Continue →</button></div>';
    }
  } else if(stage.freeText){
    var key = c.id+'-'+stage.key;
    var val = state.freetext[key] || '';
    var revealed = state.reportRevealed[key];
    h += '<p style="margin-bottom:10px">'+escapeHtml(stage.freeText.prompt)+'</p>';
    h += '<div class="field"><textarea id="ft-'+key+'" data-freetext-key="'+key+'" placeholder="'+escapeHtml(stage.freeText.placeholder)+'">'+escapeHtml(val)+'</textarea></div>';
    if(!revealed) h += '<div class="btn-row"><button class="btn" data-action="wf-reveal-model" data-key="'+key+'" data-case="'+c.id+'">Compare to a model answer</button></div>';
    if(revealed){
      h += '<div class="feedback-box feedback-info"><strong>One reasonable model answer:</strong><br>'+escapeHtml(stage.freeText.model)+'</div>';
      h += '<div class="btn-row" style="margin-top:10px"><button class="btn" data-action="wf-advance" data-case="'+c.id+'">Continue →</button></div>';
    }
  } else {
    h += '<p>'+escapeHtml(stage.narrative)+'</p>';
    h += '<div class="btn-row"><button class="btn" data-action="wf-advance" data-case="'+c.id+'">Continue →</button></div>';
  }
  h += '</div>';
  return h;
}

function renderFourFactorEngine(mod){

    h += '<div class="card" style="margin-bottom:12px"><div class="eyebrow">'+escapeHtml(f.label)+'</div><div>';
    f.options.forEach(function(opt){
      var cls='option-btn';
      if(answered){ if(opt.id===f.correct) cls+=' correct'; else if(answered.selected===opt.id) cls+=' incorrect'; }
      h += '<button class="'+cls+'" '+(answered?'disabled':'')+' data-action="ff-factor" data-case="'+c.id+'" data-factor="'+f.key+'" data-option="'+opt.id+'">'+escapeHtml(opt.text)+'</button>';
    });
    h += '</div>';
    if(answered) h += '<div class="feedback-box '+(answered.correct?'feedback-correct':'feedback-incorrect')+'">'+escapeHtml(f.rationale)+'</div>';
    h += '</div>';
  });
  var allFactorsAnswered = c.factors.every(function(f){return state.answers[c.id+'-'+f.key];});
  if(allFactorsAnswered){
    var finalKey = c.id+'-final';
    var finalAnswered = state.answers[finalKey];
    h += '<div class="card"><div class="eyebrow">Final determination</div><div>';
    c.finalOptions.forEach(function(opt){
      var cls='option-btn';
      if(finalAnswered){ if(opt.id===c.finalCorrect) cls+=' correct'; else if(finalAnswered.selected===opt.id) cls+=' incorrect'; }
      h += '<button class="'+cls+'" '+(finalAnswered?'disabled':'')+' data-action="ff-final" data-case="'+c.id+'" data-option="'+opt.id+'">'+escapeHtml(opt.text)+'</button>';
    });
    h += '</div>';
    if(finalAnswered) h += '<div class="feedback-box '+(finalAnswered.correct?'feedback-correct':'feedback-incorrect')+'">'+escapeHtml(c.finalRationale)+'</div>';
    h += '</div>';
  } else {
    h += '<p class="muted small">Answer all four factors above to unlock the final determination.</p>';
  }
  return h;
}

function domainStatsForCapstoneDim(dim){
  var total=0, correct=0;
  CAPSTONE.events.forEach(function(ev){
    if(ev.dims.indexOf(dim)>-1){
      var a = state.answers['cap-'+ev.id];
      if(a){ total++; if(a.correct) correct++; }
    }
  });
  return { total:total, correct:correct, pct: total? pct(correct,total): null };
}

// DIAGNOSTIC (Level 0) — deliberately ungraded; feeds a Gap Report, not the domain scores.

function renderDiagnostic(){
  var h = '<div class="content">';
  h += '<div class="eyebrow">Level 0</div><h1>Diagnostic Assessment</h1>';
  h += '<p class="lede">Twenty questions across the full breadth of the program. There is no penalty for guessing — this only builds your personal starting map. Answer as best you can and move on.</p>';

  if(state.diagnosticDone){
    h += renderGapReport();
    h += '</div>';
    return h;
  }

  var idx = state.diagnosticIndex || 0;
  if(idx>=DIAGNOSTIC_QUESTIONS.length) idx = DIAGNOSTIC_QUESTIONS.length-1;
  var q = DIAGNOSTIC_QUESTIONS[idx];
  var ans = state.diagnosticAnswers[q.id];

  // Diagnostic uses its own lightweight chip row (answered vs not — no correct/incorrect color, to keep it low-pressure)
  h += '<div class="step-track">';
  DIAGNOSTIC_QUESTIONS.forEach(function(dq,i){
    var a = state.diagnosticAnswers[dq.id];
    var cls='step-chip'+(i===idx?' current':(a?' done':''));
    h += '<button class="'+cls+'" data-action="diag-nav" data-index="'+i+'">'+(i+1)+'</button>';
  });
  h += '</div>';

  h += '<div class="card"><div class="eyebrow">Question '+(idx+1)+' of '+DIAGNOSTIC_QUESTIONS.length+'</div>';
  h += '<p style="font-size:16px;margin-bottom:16px">'+escapeHtml(q.prompt)+'</p><div>';
  q.options.forEach(function(opt){
    var cls='option-btn';
    if(ans){ if(opt.id===q.correct) cls+=' correct'; else if(ans.selected===opt.id) cls+=' incorrect'; }
    h += '<button class="'+cls+'" '+(ans?'disabled':'')+' data-action="diag-select" data-qid="'+q.id+'" data-option="'+opt.id+'">'+escapeHtml(opt.text)+'</button>';
  });
  h += '</div>';
  if(ans) h += '<div class="feedback-box feedback-info">'+escapeHtml(q.explanation)+'</div>';
  h += '</div>';

  h += '<div class="btn-row" style="margin-top:14px">';
  if(idx>0) h += '<button class="btn-outline btn" data-action="diag-nav" data-index="'+(idx-1)+'">← Previous</button>';
  if(idx<DIAGNOSTIC_QUESTIONS.length-1) h += '<button class="btn btn-outline" data-action="diag-nav" data-index="'+(idx+1)+'">Next →</button>';
  var answeredCount = Object.keys(state.diagnosticAnswers).length;
  h += '<button class="btn btn-brass" data-action="diag-finish">See my Gap Report ('+answeredCount+'/'+DIAGNOSTIC_QUESTIONS.length+' answered)</button>';
  h += '</div></div>';
  return h;
}
function renderGapReport(){
  var byDomain = {};
  DIAGNOSTIC_QUESTIONS.forEach(function(q){
    var a = state.diagnosticAnswers[q.id];
    if(!byDomain[q.domain]) byDomain[q.domain] = {total:0, correct:0};

function labelFreeTextKey(k){
  if(k.indexOf('report-')===0){
    var sec = k.slice(7);
    var s = OCR_CASE.reportSections.filter(function(x){return x.key===sec;})[0];
    return 'Mock OCR Investigation Report — '+(s?s.label:sec);
  }
  if(k.indexOf('brief-')===0){
    var sec2 = k.slice(6);
    var t = EXEC_BRIEFING_CASE.tasks.filter(function(x){return x.key===sec2;})[0];
    return 'Executive Briefing — '+(t?t.label:sec2);
  }
  if(k.indexOf('rd-')===0){
    var parts = k.split('-');
    var caseId = parts[1], section = parts.slice(2).join('-');
    var c = RESEARCH_DESK.filter(function(x){return x.id===caseId;})[0];
    return 'Research Desk: '+(c?c.title:caseId)+' — '+section;
  }
  if(k.indexOf('sltext-')===0){
    var qkey = k.slice(7);
    var q = STATE_LAW_CASE.questions.filter(function(x){return x.key===qkey;})[0];
    return 'State Law Research — '+(q?q.prompt.slice(0,70):qkey);
  }
  if(/-mitigation$/.test(k)){
    var rowId = k.replace('-mitigation','');
    var row = RISK_REGISTER_EXERCISE.rows.filter(function(x){return x.id===rowId;})[0];
    return 'Risk Register Mitigation — '+(row?row.asset:rowId);
  }
  var possibleCaseId = k.split('-').slice(0,2).join('-');
  var wfCase = findWorkflowCase(possibleCaseId);
  if(wfCase){
    var stageKey = k.replace(wfCase.id+'-','');
    var st = wfCase.stages.filter(function(s){return s.key===stageKey;})[0];
    return 'Case: '+wfCase.title+' — '+(st?st.label:stageKey);
  }
  return k;
}
function generatePortfolioText(){
  var lines = [];
  lines.push('PRIVACY OFFICER COMMAND — EDUCATIONAL PORTFOLIO');
  lines.push('Generated: '+new Date().toString());
  lines.push('Training content last verified: '+APP_BUILD_DATE);
  lines.push('');
  lines.push('*** THIS IS AN EDUCATIONAL SIMULATION. It reflects work completed inside a training program and is');
  lines.push('NOT real compliance work product. Do not represent it as an actual privacy assessment, legal analysis,');
  lines.push('or compliance determination for any real organization. ***');
  lines.push('');
  var ri = readinessIndex();
  lines.push('READINESS INDEX: '+ri+' / 100 — '+readinessBand(ri));
  lines.push('This score is an educational competency indicator only. Employment and professional qualification');
  lines.push('depend on the employer, applicable law, experience, and credentials.');
  lines.push('');
  lines.push('COMPETENCY BY DOMAIN');
  Object.keys(DOMAINS).forEach(function(k){
    var s = domainStats(k);
    lines.push('- '+DOMAINS[k]+': '+(s.pct===null?'not yet attempted':s.pct+'% ('+s.correct+'/'+s.total+' correct)'));
  });
  lines.push('');
  if(state.diagnosticDone){
    lines.push('DIAGNOSTIC GAP REPORT (baseline snapshot — not part of the competency score)');
    var byDomain = {};
    DIAGNOSTIC_QUESTIONS.forEach(function(q){
      var a = state.diagnosticAnswers[q.id];
      if(!byDomain[q.domain]) byDomain[q.domain]={total:0,correct:0};
      if(a){ byDomain[q.domain].total++; if(a.correct) byDomain[q.domain].correct++; }
    });
    Object.keys(byDomain).forEach(function(k){
      var d=byDomain[k];
      lines.push('- '+(DOMAINS[k]||k)+': '+(d.total?pct(d.correct,d.total)+'%':'not answered'));
    });
    lines.push('');
  }
  lines.push('MODULE PROGRESS');
  MODULES.forEach(function(m){
    var s = moduleStats(m);
    lines.push('- Module '+m.id+' ('+m.title+'): '+(s.total? s.attempted+'/'+s.total+' attempted, '+s.pct+'% correct' : 'reference module'));
  });
  lines.push('');

  var ftKeys = Object.keys(state.freetext).filter(function(k){ return (state.freetext[k]||'').trim().length>0; });
  if(ftKeys.length){
    lines.push('=== WRITTEN WORK ===');
    lines.push('');
    ftKeys.forEach(function(k){
      lines.push('--- '+labelFreeTextKey(k)+' ---');
      lines.push(state.freetext[k]);
      lines.push('');
    });
  }

  var ffDone = FOURFACTOR_CASES.filter(function(c){return state.answers[c.id+'-final'];});
  if(ffDone.length){
    lines.push('=== FOUR-FACTOR BREACH DETERMINATIONS ===');
    ffDone.forEach(function(c){
      var a = state.answers[c.id+'-final'];
      var opt = c.finalOptions.filter(function(o){return o.id===a.selected;})[0];
      lines.push('- '+c.title+': "'+(opt?opt.text:a.selected)+'" — '+(a.correct?'consistent with the defensible analysis':'differs from the model analysis; review the in-app rationale'));
    });
    lines.push('');
  }

  var regDone = RISK_REGISTER_EXERCISE.rows.filter(function(r){return state.answers[r.id+'-rate'];});
  if(regDone.length){
    lines.push('=== RISK REGISTER ===');
    regDone.forEach(function(r){
      var a = state.answers[r.id+'-rate'];
      lines.push('- '+r.asset+': your rating '+(a.selected?a.selected.like+' likelihood / '+a.selected.imp+' impact':'—')+' (model: '+r.modelLikelihood+' / '+r.modelImpact+')');
    });
    lines.push('');
  }

  var capDone = CAPSTONE.events.filter(function(e){return state.answers['cap-'+e.id];});
  if(capDone.length){
    lines.push('=== CAPSTONE SIMULATION DECISIONS ===');
    capDone.forEach(function(e,i){
      var a = state.answers['cap-'+e.id];
      lines.push('- Event '+(i+1)+': '+(a.correct?'strong decision':'reviewed — see in-app feedback for the reasoning'));
    });
    lines.push('');
  }

  lines.push('=== END OF PORTFOLIO — EDUCATIONAL SIMULATION ONLY ===');
  return lines.join('\n');
}

  if(state.ui.openModal==='whatchanged'){
    var h = '<div class="modal-backdrop" data-action="close-modal"><div class="modal" style="max-width:760px" onclick="event.stopPropagation()">';
    h += '<div class="modal-head"><div class="eyebrow">What Changed?</div><button class="modal-close" data-action="close-modal">×</button></div>';
    h += '<h2 style="margin-bottom:14px">Recent HIPAA &amp; health-privacy developments</h2>';
    var sorted = REGULATORY_WATCH.slice();
    h += '<div style="max-height:60vh;overflow-y:auto">';
    sorted.forEach(function(r){
      var isNew = state.whatChangedSeen.indexOf(r.id)===-1;
      h += '<div class="card card-tight" style="margin-bottom:10px">';
      h += '<div class="mod-card-top"><div class="mod-title" style="font-size:14.5px">'+escapeHtml(r.title)+(isNew?' <span class="badge badge-vacated">New to you</span>':'')+'</div>'+statusBadge(r.status)+'</div>';
      h += '<p class="small muted" style="margin:6px 0 0">'+escapeHtml(r.when)+'</p>';
      h += '<button class="btn-ghost" data-action="nav" data-view="regwatch" style="padding:6px 0">Full entry →</button>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="btn-row" style="margin-top:10px"><button class="btn" data-action="mark-whatchanged-seen">Mark all reviewed</button><button class="btn-outline btn" data-action="close-modal">Close</button></div>';
    h += '</div></div>';
    return h;
  }
  return '';
}

// ---------------------------------------------------------------------------------------
// DISPATCH — every interactive action in the app funnels through here.
// ---------------------------------------------------------------------------------------
function syncFreeText(){
  document.querySelectorAll('[data-freetext-key]').forEach(function(el){
    state.freetext[el.getAttribute('data-freetext-key')] = el.value;
  });
}
function extendItemFinder(source, itemId){
  if(source==='statelaw'){
    var key = itemId.replace(/^sl-/,'');
    return STATE_LAW_CASE.questions.filter(function(q){return q.key===key;})[0];
  }
  if(source==='map'){
    return getModule1Quiz().filter(function(q){return q.id===itemId;})[0];
  }
  return findSourceItem(source, itemId);
}
function findWorkflowCase(caseId){
  var pools = [WORKFLOW_CASES.m10.cases, WORKFLOW_CASES.m11.cases];
  for(var p=0;p<pools.length;p++){ for(var i=0;i<pools[p].length;i++){ if(pools[p][i].id===caseId) return pools[p][i]; } }
  return null;
}

function dispatch(el){
  syncFreeText();
  var d = el.dataset;
  var action = d.action;

  switch(action){
    case 'nav': navigate(d.view, {}); return;
    case 'nav-module':
    case 'module-tab':
      navigate('module', {moduleId:Number(d.module), tab:d.tab||'learn'}); return;

    case 'open-authority': state.ui.openModal='authority'; state.ui.authorityKey=d.key; render(); return;
    case 'open-whatchanged': state.ui.openModal='whatchanged'; render(); return;
    case 'close-modal': state.ui.openModal=null; render(); return;
    case 'mark-whatchanged-seen':
      state.whatChangedSeen = REGULATORY_WATCH.map(function(r){return r.id;});
      scheduleSave(); state.ui.openModal=null; render(); return;

    case 'item-nav': state.ui[d.navkey+'-idx'] = Number(d.index); render(); return;

    case 'select-single': {
      if(!state.answers[d.itemid]){
        var item = extendItemFinder(d.source, d.itemid);
        if(item){
          var correctVal = (item.answer!==undefined) ? item.answer : item.correct;
          recordAnswer(d.itemid, d.option===correctVal, d.domain||null, d.option);
        }
      }
      render(); return;
    }
    case 'toggle-multi': {
      if(state.answers[d.itemid]){ render(); return; }
      var pkey='pending-'+d.itemid;
      var arr = (state.ui[pkey]||[]).slice();
      var i = arr.indexOf(d.option);
      if(i>-1) arr.splice(i,1); else arr.push(d.option);
      state.ui[pkey]=arr; render(); return;
    }
    case 'submit-multi': {
      var mitem = extendItemFinder(d.source, d.itemid);
      var picked = (state.ui['pending-'+d.itemid]||[]).slice().sort();
      var correctSet = mitem.multiCorrect.slice().sort();
      var match = correctSet.length===picked.length && correctSet.every(function(v,idx){return v===picked[idx];});
      recordAnswer(d.itemid, match, d.domain||null, picked);
      render(); return;
    }
    case 'finish-assess': {
      var ids = d.ids.split(',');
      var navKey = d.navkey;
      state.ui[navKey+'-done']=true;
      var attempted=0, correctC=0;
      ids.forEach(function(id){ var a=state.answers[id]; if(a){attempted++; if(a.correct) correctC++;} });
      state.assessScores[d.module] = attempted?pct(correctC,attempted):0;
      state.assessAttempts[d.module] = (state.assessAttempts[d.module]||0)+1;
      scheduleSave(); render(); return;
    }
    case 'retry-assess': {
      var mod = moduleById(Number(d.module));
      var oldIds = getAssessItemIds(mod);
      oldIds.forEach(function(id){ delete state.answers[id]; });
      delete state.assessSample[mod.id];
      var prefix = mod.practice==='classify' ? 'classify-' : 'scenario-';
      var navKey2 = prefix+mod.id+'-assess';
      state.ui[navKey2+'-done']=false; state.ui[navKey2+'-idx']=0;
      scheduleSave(); render(); return;
    }

    case 'map-toggle': state.ui['map-open-'+d.cid] = !state.ui['map-open-'+d.cid]; render(); return;
    case 'doclab-toggle': state.ui['doclab-open-'+d.id] = !state.ui['doclab-open-'+d.id]; render(); return;

    case 'wf-open-case': state.ui['wf-active-'+d.module]=d.case; render(); return;
    case 'wf-back': state.ui['wf-active-'+d.module]=null; render(); return;
    case 'wf-decide': {
      var c = findWorkflowCase(d.case);
      var stage = c.stages.filter(function(s){return s.key===d.stage;})[0];
      recordAnswer(d.case+'-'+d.stage, d.option===stage.decision.correct, d.domain||null, d.option);
      render(); return;
    }
    case 'wf-advance': {
      state.workflowProgress[d.case] = (state.workflowProgress[d.case]||0)+1;
      scheduleSave(); render(); return;
    }
    case 'wf-reveal-model': state.reportRevealed[d.key]=true; scheduleSave(); render(); return;
    case 'wf-reset-case': {
      var cc = findWorkflowCase(d.case);
      cc.stages.forEach(function(s){
        if(s.decision) delete state.answers[d.case+'-'+s.key];
        if(s.freeText){ delete state.freetext[d.case+'-'+s.key]; delete state.reportRevealed[d.case+'-'+s.key]; }
      });
      delete state.workflowProgress[d.case];
      scheduleSave(); render(); return;
    }

    case 'ff-open': state.ui['ff-active']=d.case; render(); return;
    case 'ff-back': state.ui['ff-active']=null; render(); return;
    case 'ff-factor': {
      var fc = FOURFACTOR_CASES.filter(function(x){return x.id===d.case;})[0];
      var f = fc.factors.filter(function(x){return x.key===d.factor;})[0];
      recordAnswer(d.case+'-'+d.factor, d.option===f.correct, 'breach', d.option);
      render(); return;
    }
    case 'ff-final': {
      var fc2 = FOURFACTOR_CASES.filter(function(x){return x.id===d.case;})[0];
      recordAnswer(d.case+'-final', d.option===fc2.finalCorrect, 'breach', d.option);
      render(); return;
    }

    case 'reg-pick': state.ui[d.row+'-'+d.field]=d.value; render(); return;
    case 'reg-submit': {
      var row = RISK_REGISTER_EXERCISE.rows.filter(function(r){return r.id===d.row;})[0];
      var like = state.ui[d.row+'-like'], imp = state.ui[d.row+'-imp'];
      var ok = (like===row.modelLikelihood && imp===row.modelImpact);
      recordAnswer(d.row+'-rate', ok, d.domain||null, {like:like,imp:imp});
      render(); return;
    }

    case 'reveal-report': state.reportRevealed['ocr']=true; scheduleSave(); render(); return;
    case 'reveal-briefing': state.briefingRevealed['exec']=true; scheduleSave(); render(); return;
    case 'reveal-research': state.researchDeskRevealed[d.key]=true; scheduleSave(); render(); return;
    case 'reveal-researchdesk': state.researchDeskRevealed[d.key]=true; scheduleSave(); render(); return;

    case 'rubric-toggle': {
      var checked = el.checked;
      state.rubricChecks[d.key+'-'+d.idx]=checked;
      recordAnswer(d.key+'-rubric-'+d.idx, checked, d.domain||null, checked);
      render(); return;
    }

    case 'cap-decide': {
      var ev = CAPSTONE.events.filter(function(x){return x.id===d.event;})[0];
      recordAnswer('cap-'+d.event, d.option===ev.correct, 'exec_judgment', d.option);
      render(); return;
    }
    case 'cap-advance': state.capstone.index=(state.capstone.index||0)+1; scheduleSave(); render(); return;
    case 'cap-restart': {
      CAPSTONE.events.forEach(function(ev){ delete state.answers['cap-'+ev.id]; });
      state.capstone={index:0,dims:{},started:false,done:false}; scheduleSave(); render(); return;
    }

    case 'diag-select': {
      if(!state.diagnosticAnswers[d.qid]){
        var q = DIAGNOSTIC_QUESTIONS.filter(function(x){return x.id===d.qid;})[0];
        state.diagnosticAnswers[d.qid] = {selected:d.option, correct:d.option===q.correct};
        scheduleSave();
      }
      render(); return;
    }
    case 'diag-nav': state.diagnosticIndex=Number(d.index); render(); return;
    case 'diag-finish': state.diagnosticDone=true; scheduleSave(); render(); return;
    case 'diag-retake': state.diagnosticAnswers={}; state.diagnosticDone=false; state.diagnosticIndex=0; scheduleSave(); render(); return;

    case 'download-portfolio': triggerPortfolioDownload(); return;

    default: render(); return;
  }
}

// ---------------------------------------------------------------------------------------
// INIT
// ---------------------------------------------------------------------------------------
document.getElementById('app').addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  dispatch(el);
});
document.getElementById('app').addEventListener('change', function(e){
  var el = e.target.closest('[data-action="rubric-toggle"]');
  if(!el) return;
  dispatch(el);
});

loadState();
</script>
